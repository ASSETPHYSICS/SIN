<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003ch1\u003eDatenschutzerklärung\u003c/h1\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eDatenschutzerklärung\u003c/p\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eDatenschutzhinweise nach Art. 13, 14 und 21 DSGVO für die Website, externe Seiten und andere Verarbeitungsvorgänge der ServiceInvest Kapitalverwaltungsgesellschaft mbH\u003c/p\u003e\n\u003cnav class=\u0022ip-toc\u0022 aria-label=\u0022Inhaltsverzeichnis\u0022\u003e\u003cul\u003e\u003cli\u003e\u003ca href=\u0022#allgemeines\u0022\u003eI. Allgemeines\u003c/a\u003e\u003cul\u003e\u003cli\u003e1. Verantwortlicher\u003c/li\u003e\u003cli\u003e2. Definitionen\u003c/li\u003e\u003cli\u003e3. Informationen zur Datenverarbeitung\u003c/li\u003e\u003cli\u003e4. Speicherdauer\u003c/li\u003e\u003cli\u003e5. Automatisierte Entscheidungen im Einzelfall einschließlich Profiling\u003c/li\u003e\u003cli\u003e6. Rechte betroffener Personen\u003c/li\u003e\u003cli\u003e7. Mitteilungspflichten des Verantwortlichen\u003c/li\u003e\u003cli\u003e8. Pflicht zur Bereitstellung\u003c/li\u003e\u003cli\u003e9. Widerspruch und Widerruf\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#datenverarbeitung-im-zusammenhang-mit-der-nutzung-unserer-website\u0022\u003eII. Datenverarbeitung im Zusammenhang mit der Nutzung unserer Website\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#datenverarbeitung-auf-unserer-karriereseite-karriere-2ig-de\u0022\u003eIII. Datenverarbeitung auf unserer Karriereseite (karriere.2ig.de)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#weitere-datenverarbeitungsvorgaenge-ausserhalb-unserer-website-und-unserer-externen-seiten\u0022\u003eIV. Weitere Datenverarbeitungsvorgänge außerhalb unserer Website und unserer externen Seiten\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#angaben-zur-speicherdauer-einwilligungsbasierter-cookies-und-aehnlicher-technologien\u0022\u003eV. Angaben zur Speicherdauer einwilligungsbasierter Cookies und ähnlicher Technologien\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/nav\u003e\n\u003ch2 id=\u0022allgemeines\u0022\u003eI. Allgemeines\u003c/h2\u003e\n\u003cp\u003e1. Verantwortlicher\u003c/p\u003e\n\u003cp\u003eWir, die ServiceInvest Kapitalverwaltungsgesellschaft mbH, nehmen den Schutz Ihrer personenbezogenen Daten und die diesem Schutz dienenden gesetzlichen Verpflichtungen sehr ernst. Die gesetzlichen Vorgaben verlangen umfassende Transparenz über die Verarbeitung personenbezogener Daten. Nur wenn Sie ausreichend über Zweck, Art und Umfang der Verarbeitung informiert sind, ist die Verarbeitung für Sie als betroffene Person nachvollziehbar.\u003c/p\u003e\n\u003cp\u003eUnsere Datenschutzerklärung erklärt Ihnen deshalb ausführlich, welche personenbezogenen Daten von uns bei der Nutzung unserer Website (www.serviceinvest.de), allen hierauf verweisenden anderen Internetseiten und in den anderen, hier ggf. erläuterten Fällen, verarbeitet werden (Definitionen s. unter I.2.). Verantwortlicher im Sinne der Datenschutz-Grundverordnung (DSGVO), des Bundesdatenschutzgesetzes (BDSG) sowie sonstiger datenschutzrechtlicher Vorgaben ist\u003c/p\u003e\n\u003cp\u003eServiceInvest Kapitalverwaltungsgesellschaft mbH\u003cbr\u003eFürstenrieder Straße 61\u003cbr\u003eD-80686 München\u003c/p\u003e\n\u003cp\u003eE-Mail: \u003ca href=\u0022mailto:datenschutz@2ig.de\u0022\u003edatenschutz@2ig.de\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eIm Folgenden „Verantwortlicher“ oder „wir“ genannt.\u003c/p\u003e\n\u003cp\u003eSie erreichen den Datenschutzbeauftragten unter:\u003c/p\u003e\n\u003cp\u003eSascha Kremer, c/o KREMER LEGAL, Bahnhofstraße 66, 41236 Mönchengladbach, \u003ca href=\u0022mailto:sascha.kremer@kremer.legal\u0022\u003esascha.kremer@kremer.legal\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eBitte beachten Sie, dass Sie über Links auf unserer Website zu anderen Websites gelangen können, die nicht von uns, sondern von Dritten betrieben werden. Solche Links werden von uns entweder eindeutig gekennzeichnet oder sind durch einen Wechsel in der Adresszeile Ihres Browsers erkennbar. Für die Einhaltung der datenschutzrechtlichen Bestimmungen und einen sicheren Umgang mit Ihren personenbezogenen Daten auf diesen von Dritten betriebenen Websites sind wir nicht verantwortlich.\u003c/p\u003e\n\u003cp\u003e2. Definitionen\u003c/p\u003e\n\u003ch3\u003eAus der DSGVO\u003c/h3\u003e\n\u003cp\u003eDiese Datenschutzerklärung verwendet die Begriffe des Gesetzestextes der DSGVO. Die Begriffsbestimmungen (Art. 4 DSGVO) können Sie z.B. unter \u003ca href=\u0022https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003ehttps://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679\u003c/a\u003e einsehen.\u003c/p\u003e\n\u003cp\u003eZusätzliche Begriffsbestimmungen:\u003c/p\u003e\n\u003ch3\u003eCookies und ähnliche Technologien\u003c/h3\u003e\n\u003cp\u003eCookies sind Textdateien, die von einer Website auf Ihrem Endgerät abgelegt bzw. dort ausgelesen werden. Sie enthalten Buchstaben- und Zahlenkombinationen, um z.B. bei einer erneuten Verbindung zur Cookie-setzenden Website den Nutzer und seine Einstellungen wiederzuerkennen, das Eingeloggt-Bleiben in einem Kundenkonto zu ermöglichen oder ein bestimmtes Nutzungsverhalten statistisch zu analysieren.\u003c/p\u003e\n\u003cp\u003eDie WebStorage Technik ermöglicht es, Variablen und Werte lokal im Browser-Cache des Nutzers zu speichern. Die Technik umfasst sowohl den sog. „sessionStorage„, der bis zum Beenden des Browser-Tabs gespeichert bleibt, wie auch den „localStorage„, der so lange im Cache des Browsers gespeichert wird, bis der Cache vom Nutzer geleert wird. Die localStorage Technik ermöglicht es u.a., den Nutzer und seine Einstellungen bei dem Aufruf unserer Website wiederzuerkennen.\u003c/p\u003e\n\u003ch3\u003eDatenkategorien\u003c/h3\u003e\n\u003cp\u003eWenn wir die verarbeiteten Datenkategorien angeben, sind darunter insbesondere die folgenden Daten gemeint: Stammdaten (z.B. Namen, Anschrift, Geburtsdaten), Kontaktdaten (z.B. E-Mail-Adressen, Telefonnummer, Messengerdienste), Inhaltsdaten (z.B. Texteingaben, Fotografien, Videos, Inhalte von Dokumenten/Dateien), Vertragsdaten (z.B. Vertragsgegenstand, Laufzeiten, Kundenkategorie), Zahlungsdaten (z.B. Bankverbindungen, Zahlungshistorie, Verwendung sonstiger Zahlungsdienstleister), Nutzungsdaten (z.B. Verlauf auf unserer Website, Nutzung bestimmter Inhalte, Zugriffszeiten, Kontakt- oder Bestellhistorie), Verbindungsdaten (z.B. Geräte-Informationen, IP-Adressen, URL-Referrer), Standortdaten (z.B. GPS-Daten, IP-Geolokalisierung, Zugriffspunkte).\u003c/p\u003e\n\u003cp\u003e3. Informationen zur Datenverarbeitung\u003c/p\u003e\n\u003cp\u003eWir verarbeiten personenbezogene Daten nur, soweit dies gesetzlich zulässig ist. Eine Weitergabe personenbezogener Daten findet ausschließlich in den unten beschriebenen Fällen statt. Die personenbezogenen Daten werden durch angemessene technische und organisatorische Maßnahmen (z.B. Pseudonymisierung, Verschlüsselung) geschützt.\u003c/p\u003e\n\u003cp\u003eSofern wir nicht gesetzlich zu einer Speicherung oder einer Weitergabe an Dritte (insbesondere Strafverfolgungsbehörden) verpflichtet sind, hängt die Entscheidung, welche personenbezogenen Daten von uns wie lange verarbeitet werden und in welchem Umfang wir sie ggf. offenlegen, davon ab, welche Funktionen der Website Sie im Einzelfall nutzen.\u003c/p\u003e\n\u003cp\u003e4. Speicherdauer\u003c/p\u003e\n\u003cp\u003eDie personenbezogenen Daten werden gelöscht, sobald der Zweck der Verarbeitung entfällt oder eine vorgeschriebene Speicherfrist abläuft, es sei denn, dass eine Erforderlichkeit zur weiteren Speicherung der personenbezogenen Daten für einen Vertragsabschluss oder eine Vertragserfüllung besteht. Soweit wir über die Speicherdauer von Cookies und ähnlichen Technologien informieren müssen, finden Sie die Angaben hierzu am Ende dieser Datenschutzerklärung.\u003c/p\u003e\n\u003cp\u003ePersonenbezogene Daten, die wir im Rahmen einer Bewerbung (s. unten) verarbeiten, werden für die Dauer von sechs Monaten nach Abschluss des Bewerbungsverfahrens gespeichert.\u003c/p\u003e\n\u003cp\u003e5. Automatisierte Entscheidungen im Einzelfall einschließlich Profiling\u003cbr\u003eAutomatisierte Entscheidungen im Einzelfall einschließlich Profiling erfolgen nicht.\u003c/p\u003e\n\u003cp\u003e6. Rechte betroffener Personen\u003c/p\u003e\n\u003cp\u003eSie haben als betroffene Person das Recht auf Auskunft nach Art. 15 DSGVO, das Recht auf Berichtigung nach Art. 16 DSGVO, das Recht auf Löschung nach Art. 17 DSGVO, das Recht auf Einschränkung der Verarbeitung nach Art. 18 DSGVO sowie das Recht auf Datenübertragbarkeit nach Art. 20 DSGVO. Beim Auskunftsrecht und beim Löschungsrecht gelten die Beschränkungen aus §§ 34, 35 BDSG.\u003c/p\u003e\n\u003cp\u003eSie haben das Recht, sich bei einer Datenschutzaufsichtsbehörde zu beschweren (Art. 77 DSGVO in Verbindung mit § 19 BDSG).\u003c/p\u003e\n\u003cp\u003eDie für uns/ für unsere Hauptniederlassung zuständige Datenschutzaufsichtsbehörde ist:\u003c/p\u003e\n\u003cp\u003eDer Hessische Beauftragte für Datenschutz und Informationsfreiheit\u003cbr\u003eGustav-Stresemann-Ring 1\u003cbr\u003e65189 Wiesbaden\u003c/p\u003e\n\u003cp\u003eIhnen steht es aber frei, sich bei einer anderen Datenschutzaufsichtsbehörde zu beschweren. Eine Liste der Aufsichtsbehörden finden Sie unter: \u003ca href=\u0022https://www.bfdi.bund.de/\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003ehttps://www.bfdi.bund.de/\u003c/a\u003e (unter Infothek/Anschriften und Links)\u003c/p\u003e\n\u003cp\u003e7. Mitteilungspflichten des Verantwortlichen\u003c/p\u003e\n\u003cp\u003eWir teilen allen Empfängern, denen Ihre personenbezogenen Daten offengelegt wurden, jede Berichtigung oder Löschung Ihrer personenbezogenen Daten oder eine Einschränkung der Verarbeitung nach Art. 16, Art. 17 Abs. 1 und Art. 18 DSGVO mit, es sei denn, die Mitteilung ist unmöglich oder mit einem unverhältnismäßigen Aufwand verbunden. Wir unterrichten Sie über die Empfänger, wenn Sie dies verlangen.\u003c/p\u003e\n\u003cp\u003e8. Pflicht zur Bereitstellung\u003c/p\u003e\n\u003cp\u003eSoweit nachfolgend bei den Angaben zu den Rechtsgrundlagen nichts anderes erläutert wird, sind Sie zur Bereitstellung personenbezogener Daten nicht verpflichtet. In den Fällen des Art. 6 Abs. 1 Buchst. b DSGVO sind die personenbezogenen Daten jedoch zu einer Vertragserfüllung oder zu einem Vertragsabschluss erforderlich. Stellen Sie die betroffenen personenbezogenen Daten nicht zur Verfügung, ist die Vertragserfüllung oder der Vertragsabschluss nicht möglich. Stellen Sie die Daten in den Fällen des Art. 6 Abs. 1 Buchst. a, f DSGVO nicht zur Verfügung, ist eine Nutzung der betroffenen Teile unserer Website nicht möglich.\u003c/p\u003e\n\u003cp\u003e9. Widerspruch und Widerruf\u003c/p\u003e\n\u003cp\u003eSie haben das Recht, aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit gegen die Verarbeitung der Sie betreffenden personenbezogenen Daten, die aufgrund von Art. 6 Abs. 1 Buchst. f DSGVO erfolgt, Widerspruch einzulegen. Werden personenbezogene Daten verarbeitet, um Direktwerbung zu betreiben, so haben Sie das Recht, jederzeit Widerspruch gegen die Verarbeitung sie betreffender personenbezogener Daten zum Zwecke derartiger Werbung einzulegen.\u003c/p\u003e\n\u003cp\u003eSie haben gemäß Art. 7 Abs. 3 S. 1 DSGVO das Recht, Ihre Einwilligung jederzeit mit Wirkung für die Zukunft formlos per Post oder E-Mail zu widerrufen. Die Rechtmäßigkeit der aufgrund der Einwilligung bis zum Widerruf erfolgten Verarbeitung wird hiervon nicht berührt. Auf Ihren Widerruf werden wir die auf Grundlage der Einwilligung verarbeiteten personenbezogenen Daten löschen, wenn es keine andere Rechtsgrundlage für deren Verarbeitung gibt.\u003c/p\u003e\n\u003cp\u003eWiderspruch und Widerruf können formfrei erfolgen und sollten gerichtet werden an die oben genannten Kontaktdaten.\u003c/p\u003e\n\u003cp\u003eSie können bestimmte Einwilligung(en) auf unserer „Karriereseite“ direkt über unser Cookie-Consent-Tool widerrufen. Bitte beachten Sie, dass Sie dies auf jedem Endgerät, auf dem Sie unsere Website besucht und in die Datenverarbeitung eingewilligt haben, vornehmen müssen.\u003c/p\u003e\n\u003ch2 id=\u0022datenverarbeitung-im-zusammenhang-mit-der-nutzung-unserer-website\u0022\u003eII. Datenverarbeitung im Zusammenhang mit der Nutzung unserer Website\u003c/h2\u003e\n\u003cp\u003eDie Nutzung der Website und ihrer Funktionen erfordert regelmäßig die Verarbeitung personenbezogener Daten.\u003c/p\u003e\n\u003ch3\u003eBereitstellung der Website\u003c/h3\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eZweck der Verarbeitung:\u003c/strong\u003e Funktionsfähigkeit und Optimierung der Website, sowie Gewährleistung der Sicherheit unserer informationstechnischen Systeme bei rein informatorischer Nutzung unserer Website (ohne Verwendung von Zusatzfunktionen); Einbindung und Anzeige von Funktionen und Inhalten (z.B. Grafiken), die wir nicht selbst bereitstellen.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRechtsgrundlage:\u003c/strong\u003e Art. 6 Abs. 1 Buchst. f DSGVO.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDatenkategorien:\u003c/strong\u003e Verbindungsdaten\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eEmpfänger der Daten:\u003c/strong\u003e IT-Dienstleister\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eBeabsichtigte Drittlandübermittlung:\u003c/strong\u003e Keine\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eSpeichern wir auf Ihrem Endgerät aufgrund Ihrer Einwilligung personenbezogene Daten oder lesen solche aus?\u003c/strong\u003e Nein\u003c/p\u003e\n\u003cp\u003eKon
