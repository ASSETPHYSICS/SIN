<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap\u0022\u003e\u003cdiv class=\u0022ip-nh-card\u0022\u003e\n\u003ch2\u003eOur Beliefs\u003c/h2\u003e\n\u003cp\u003eSince the company was founded, the core value proposition for investors and employees of Institutional Investment Partners (‘2IP’)* and its group of companies has been based on giving sustainability factors a central role in all our actions and services.\u003c/p\u003e\n\u003cp\u003eDriven by the market position we have achieved and the resulting increase in our social responsibility – as well as by broader societal developments – it is our fundamental aim to utilise our sphere of influence to make a significant corporate contribution towards a sustainable environment and society.\u003c/p\u003e\n\u003cp\u003eFor this reason, 2IP has translated the general principles of sustainable corporate governance into its own company-specific sustainability strategy, which makes sustainable conduct within and through our company binding and also takes into account any adverse impacts on sustainability factors when making investment decisions.\u003c/p\u003e\n\u003cp class=\u0022ip-footnote\u0022\u003e*Institutional Investment Partners GmbH, Frankfurt am Main, and Institutional Investment Partners S.à.r.l., Mertert (Luxembourg)\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eKey principles underpinning our sustainable approach\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eThe key elements and cornerstones of our approach are:\u003c/p\u003e\n\u003cul class=\u0022ip-check\u0022\u003e\n\u003cli\u003eSupporting impact fund projects (so-called ‘Article 9 funds’ under EU Regulation 2019/2088), which are committed to pursuing sustainability objectives that are at least on a par with return objectives.\u003c/li\u003e\n\u003cli\u003ePromoting responsible and sustainable practices amongst our property management partners by embedding codes of conduct within our business relationships.\u003c/li\u003e\n\u003cli\u003ePromoting investment and management initiatives in property that have a positive impact on\n\u003cul class=\u0022ip-sub\u0022\u003e\u003cli\u003ereduce \u003csub\u003eCO\u003c/sub\u003e₂ emissions and\u003c/li\u003e\u003cli\u003elower the overall burden on tenants through reduced heating and service charges.\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\n\u003cli\u003ePromoting the responsible use of resources.\u003c/li\u003e\n\u003cli\u003ePromoting information technology and processes designed to\n\u003cul class=\u0022ip-sub\u0022\u003e\u003cli\u003emake the consumption of resources by the fund’s properties transparent and\u003c/li\u003e\u003cli\u003emake sustainable practices measurable\u003c/li\u003e\u003c/ul\u003e\n.\u003c/li\u003e\n\u003cli\u003eImposing sanctions on behaviour intended to breach key sustainability principles.\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
<!-- /wp:divi/column -->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eCodes and Memberships\u003c/h2\u003e\u003cp class=\u0022ip-signatory\u0022\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/pri-signatory.png\u0022 alt=\u0022Principles for Responsible Investment (PRI) – Signatory\u0022 width=\u0022300\u0022 height=\u0022111\u0022\u003e\u003c/p\u003e\u003cp\u003eThe Institutional Investment Group, together with all its subsidiaries, is a signatory to the Principles for Responsible Investment (PRI), an initiative supported by the United Nations. This network of international investors is committed to establishing and putting the principles of responsible investment into practice. The PRI were developed by the investment community and reflect the view that environmental, social and governance (ESG) issues can influence the performance of investment portfolios and must therefore be given due consideration by investors if they are to fulfil their social responsibilities. By implementing the Principles, signatories contribute to the development of a more sustainable global financial system.\u003c/p\u003e\u003cp\u003eLaunched in 2006 by the UNEP Finance Initiative and the UN Global Compact, the PRI provide a voluntary framework enabling all investors to incorporate ESG considerations into their decision-making and ownership practices, thereby better aligning their objectives with those of society as a whole.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003ch3\u003eThe 6 Principles for Responsible Investment\u003c/h3\u003e\u003col class=\u0022ip-principles\u0022\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 1:\u003c/span\u003e\u003cp\u003eWe will integrate ESG issues into our investment analysis and decision-making processes.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 2:\u003c/span\u003e\u003cp\u003eWe will be active shareholders and take ESG issues into account in our investment policies and practices.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 3:\u003c/span\u003e\u003cp\u003eWe will encourage the companies and organisations in which we invest to provide appropriate disclosure regarding ESG issues.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 4:\u003c/span\u003e\u003cp\u003eWe will promote the acceptance and implementation of the Principles within the investment industry.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 5:\u003c/span\u003e\u003cp\u003eWe will work together to enhance our effectiveness in implementing the Principles.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 6:\u003c/span\u003e\u003cp\u003eWe will report on our activities and progress in implementing the Principles.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eUN Global Compact\u003c/h2\u003e\u003cp\u003eThe UN Global Compact is the world’s largest and most important initiative for responsible business conduct. It is based on 10 universal principles in the areas of\u003c/p\u003e\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003ehuman rights,\u003c/li\u003e\u003cli\u003elabour standards,\u003c/li\u003e\u003cli\u003eenvironmental protection and\u003c/li\u003e\u003cli\u003eanti-corruption\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eand, through the 17 Sustainable Development Goals (SDGs), also pursues the vision of an inclusive and sustainable global economy for the benefit of all people, communities and markets.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003ch3\u003eThe 17 Sustainable Development Goals are as follows:\u003c/h3\u003e\u003cul class=\u0022ip-sdg\u0022\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-01.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 1\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-02.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 2\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-03.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 3\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-04.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 4\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-05.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 5\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-06.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 6\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-07.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 7\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-08.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 8\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-09.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 9\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-10.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 10\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-11.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 11\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-12.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 12\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-13.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 13\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-14.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 14\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-15.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 15\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-16.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 16\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-17.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 17\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/sdg/sdg-wheel.png\u0022 alt=\u0022SDG-Farbrad\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eTaking sustainability risks into account in investment decisions\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eSustainability risks are events or conditions relating to the environment, social issues or corporate governance, the occurrence of which could have, or is likely to have, a material adverse impact on the value of an investment.\u003c/p\u003e\n\u003cp\u003eAs part of our investment decision-making process, sustainability risks are identified and assessed through our Adverse Sustainable Screening. In this process, we examine an investment against defined ESG criteria to identify events or conditions that could have a material adverse effect on its value. The results of this screening are factored into the final investment decision. If the identified sustainability risks exceed the materiality thresholds we have set, this may lead to the investment being rejected on sustainability grounds.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eSystematic consideration of adverse sustainability impacts\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eInvestment proposals are specifically assessed for significant adverse sustainability impacts and sustainability indicators as part of our Adverse Sustainability Screening:\u003c/p\u003e\u003cul class=\u0022ip-criteria\u0022\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/icon-Pollution.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eEnvironment \u0026amp; Biodiversity\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eIndications of inadequate compliance with environmental standards or of failure to prevent or remedy contamination\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/icon-Carbon.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eGreenhouse gases with no phase-out plan\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eIndications of direct support for the production or distribution of ozone-depleting gases without a phase-out plan\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/icon-Bomb.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eControversial weapons / armaments\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eIndications of direct support for the production or distribution of controversial weapons (cluster bombs, anti-personnel mines) or relevant system components\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/icon-ShakeHands.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eHuman and labour rights\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eIndications of inadequate handling of breaches of international human rights conventions or the ILO’s core labour standards (child labour, forced labour, discrimination, freedom of assembly)\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/icon-Money.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eAnti-money laundering\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eIndications of inadequate handling of screening procedures or incidents relating to money laundering\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-2IP/images/nachhaltigkeit/icon-Money.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eCorruption prevention\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eIndications of inadequate handling during screening or in relation to incidents of corruption and bribery\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIn our \u003ca href=\u0022/nachhaltigkeit/pai-statement/\u0022\u003ePrincipal Adverse Impact Statement\u003c/a\u003e, we focus on the following three indicators: (i) fossil fuels, (ii) energy efficiency and (iii) energy intensity. Our strategies for identifying and weighting these sustainability indicators are described in the statement.\u003c/p\u003e\u003cp\u003eThe results of the Adverse Sustainable Screening are factored into the final investment decision and, should materiality thresholds be exceeded, lead to us exercising our veto on sustainability grounds.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eStewardship\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eDriven by the market position we have achieved and the resulting increase in our social responsibility – as well as by broader societal developments – it is our fundamental aim to utilise our sphere of influence to make a significant corporate contribution to a sustainable environment and society.\u003c/p\u003e\n\u003cp\u003eThis includes exercising our influence (stewardship) over third parties to optimise long-term total value, including shared economic, social and environmental values, on which the returns and interests of investors and beneficiaries depend.\u003c/p\u003e\n\u003cp\u003eThe following guideline sets out how we, as an Institutional Investment Group, intend to exercise our influence responsibly in the interests of sustainability:\u003c/p\u003e\n\u003cp\u003e\u003ca href=\u0022/wp-content/themes/Divi-2IP/downloads/2023-10-31-2IG-Stewardship-Policy.pdf\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eStewardship Policy\u003c/a\u003e.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap\u0022\u003e\u003cdiv class=\u0022ip-nh-card\u0022\u003e\n\u003ch2\u003eSustainability in Remuneration Policy\u003c/h2\u003e\n\u003cp\u003eOur sustainability principles have been a central pillar of our remuneration policy since the company was founded. This applies in particular to employees with a variable remuneration component, as adherence to our sustainability principles forms part of their annual individual targets. In the event of sustainability breaches, variable remuneration components are not granted, within the limits permitted by employment law and depending on the severity of the breaches; in this respect, sustainability breaches are subject to financial penalties. In addition, individual bonuses are sometimes agreed for achieving positively defined sustainability targets. In this way, we aim to recognise significant sustainable actions financially.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
