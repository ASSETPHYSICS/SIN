<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap\u0022\u003e\u003cdiv class=\u0022ip-nh-card\u0022\u003e\n\u003ch2\u003eOur convictions\u003c/h2\u003e\n\u003cp\u003eAs part of the Institutional Investment Group the core value proposition for investors and employees of ServiceInvest Kapitalverwaltungsgesellschaft mbH has been based on placing a significant weight on sustainability factors in all actions and services.\u003c/p\u003e\n\u003cp\u003eDriven by our increased market position and social responsibility – but also by general social developments – we are committed to using our own sphere of influence to make a significant corporate contribution to a sustainable environment and society.\u003c/p\u003e\n\u003cp\u003eFor this reason, ServiceInvest has translated the general principles of sustainable corporate governance into its own corporate sustainability strategy, which makes sustainable action in and by our company binding and also takes into account any potential adverse effects on sustainability factors when making investment decisions.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eCentral cornerstones for our sustainable actions\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eCentral contents and cornerstones of our actions are:\u003c/p\u003e\n\u003cul class=\u0022ip-check\u0022\u003e\n\u003cli\u003ePromoting responsible and sustainable action by our asset and property management partners by anchoring behavioural guidelines in the business relationship.\u003c/li\u003e\n\u003cli\u003ePromoting investment and management initiatives at properties that positively work towards\n\u003cul class=\u0022ip-sub\u0022\u003e\u003cli\u003ereducing CO\u003csub\u003e2\u003c/sub\u003e emissions and\u003c/li\u003e\u003cli\u003edecreasing the overall burden on tenants through reduced heating and ancillary costs.\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\n\u003cli\u003ePromoting responsible use of resources.\u003c/li\u003e\n\u003cli\u003ePromoting information technology and processes that are designed to make\n\u003cul class=\u0022ip-sub\u0022\u003e\u003cli\u003ethe consumption of resources by fund properties transparent as well as\u003c/li\u003e\u003cli\u003esustainable action measurable.\u003c/li\u003e\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSanctioning behaviour that is intended to violate key sustainability principles.\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003ePrinciples and codes of conduct\u003c/h2\u003e\u003cp class=\u0022ip-signatory\u0022\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/pri-signatory.png\u0022 alt=\u0022Principles for Responsible Investment (PRI) – Signatory\u0022 width=\u0022300\u0022 height=\u0022111\u0022\u003e\u003c/p\u003e\u003cp\u003eThe Institutional Investment Group with its subsidiaries is a signatory to the Principles for Responsible Investment (PRI) initiative supported by the United Nations. This network of international investors is dedicated to establishing and putting into practice the principles of responsible investment. The PRI were developed by the investment community and reflect the view that environmental, social and governance (ESG) issues can affect the performance of investment portfolios and therefore need to be properly considered by investors if they are to meet their social responsibilities. By implementing the Principles, signatories contribute to the development of a more sustainable global financial system.\u003c/p\u003e\u003cp\u003eLaunched in 2006 by the UNEP Finance Initiative and the UN Global Compact, the PRIs provide a voluntary framework through which all investors can integrate ESG considerations into their decision-making and ownership, and thus better align their objectives with those of society as a whole.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003ch3\u003eThe 6 Principles of Responsible Investment\u003c/h3\u003e\u003col class=\u0022ip-principles\u0022\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 1:\u003c/span\u003e\u003cp\u003eWe will incorporate ESG issues into investment analysis and decision-making processes.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 2:\u003c/span\u003e\u003cp\u003eWe will be active owners and incorporate ESG issues into our ownership policies and practices.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 3:\u003c/span\u003e\u003cp\u003eWe will seek appropriate disclosure on ESG issues by the entities in which we invest.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 4:\u003c/span\u003e\u003cp\u003eWe will promote acceptance and implementation of the Principles within the investment industry.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 5:\u003c/span\u003e\u003cp\u003eWe will work together to enhance our effectiveness in implementing the Principles.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinciple 6:\u003c/span\u003e\u003cp\u003eWe will each report on our activities and progress towards implementing the Principles.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eUN Global Compact\u003c/h2\u003e\u003cp\u003eThe UN Global Compact is the world’s largest and most important initiative for responsible corporate governance. It is based on 10 universal principles in the areas of\u003c/p\u003e\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003ehuman rights,\u003c/li\u003e\u003cli\u003elabour standards,\u003c/li\u003e\u003cli\u003eenvironmental protection and\u003c/li\u003e\u003cli\u003eprevention of corruption\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eand therefore pursues the vision of an inclusive and sustainable global economy for the benefit of all people, communities and markets through the 17 Sustainable Development Goals (SDGs).\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003ch3\u003eThe 17 Sustainable Development Goals are:\u003c/h3\u003e\u003cul class=\u0022ip-sdg\u0022\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-01.jpg\u0022 alt=\u0022Sustainable Development Goal 1\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-02.jpg\u0022 alt=\u0022Sustainable Development Goal 2\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-03.jpg\u0022 alt=\u0022Sustainable Development Goal 3\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-04.jpg\u0022 alt=\u0022Sustainable Development Goal 4\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-05.jpg\u0022 alt=\u0022Sustainable Development Goal 5\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-06.jpg\u0022 alt=\u0022Sustainable Development Goal 6\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-07.jpg\u0022 alt=\u0022Sustainable Development Goal 7\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-08.jpg\u0022 alt=\u0022Sustainable Development Goal 8\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-09.jpg\u0022 alt=\u0022Sustainable Development Goal 9\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-10.jpg\u0022 alt=\u0022Sustainable Development Goal 10\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-11.jpg\u0022 alt=\u0022Sustainable Development Goal 11\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-12.jpg\u0022 alt=\u0022Sustainable Development Goal 12\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-13.jpg\u0022 alt=\u0022Sustainable Development Goal 13\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-14.jpg\u0022 alt=\u0022Sustainable Development Goal 14\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-15.jpg\u0022 alt=\u0022Sustainable Development Goal 15\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-16.jpg\u0022 alt=\u0022Sustainable Development Goal 16\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-17.jpg\u0022 alt=\u0022Sustainable Development Goal 17\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-wheel.png\u0022 alt=\u0022SDG colour wheel\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eIncorporating Sustainability Risks into Investment Decisions\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eSustainability risks are events or conditions in the areas of the environment, social issues, or corporate governance whose occurrence could have, or could potentially have, a material adverse impact on the value of an investment.\u003c/p\u003e\n\u003cp\u003eAs part of our investment decision-making process, sustainability risks are identified and assessed through our Adverse Sustainable Screening. In this process, we assess an investment against defined ESG criteria to identify events or conditions that could have a material adverse effect on its value. The results of this screening are factored into the final investment decision. If the identified sustainability risks exceed the materiality thresholds we have established, this may lead to the rejection of the investment on sustainability grounds.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eSystematic consideration of adverse sustainability impacts\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eInvestment proposals are specifically screened for key negative sustainability impacts and sustainability indicators as part of our Adverse Sustainable Screening:\u003c/p\u003e\u003cul class=\u0022ip-criteria\u0022\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Pollution.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eEnvironment \u0026amp; Biodiversity\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eSigns of poor handling in the compliance with environmental standards or the prevention or remediation of contamination\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Carbon.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eEmission of gases responsible for the greenhouse effect\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eEvidence of direct support for production or distribution of ozone-depleting gases without a phase-out scenario.\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Bomb.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eCONTROVERSIAL WEAPONS / MILITARY EQUIPMENT\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eIndications of direct support for the production or distribution of controversial weapons (cluster bombs, anti-personnel mines) or relevant system components\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-ShakeHands.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eHUMAN RIGHTS \u0026amp; LABOR RIGHTS\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eSigns of inadequate handling of violations of international human rights conventions or the ILO’s core labor standards (child labor, forced labor, discrimination, freedom of association)\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Money.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eMONEY LAUNDERING PREVENTION\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eSigns of inadequate procedures in screening or in response to money laundering incidents\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Money.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eCORRUPTION PREVENTION\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eSigns of inadequate handling of screening processes or incidents of corruption and bribery\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIn our \u003ca href=\u0022/en/statement-on-principal-adverse-impacts/\u0022\u003ePrincipal Adverse Impact Statement\u003c/a\u003e, we focus on the following three indicators: (i) fossil fuels, (ii) energy efficiency and (iii) intensity of energy consumption. Our strategies for identifying and weighting these sustainability indicators are described in the statement.\u003c/p\u003e\u003cp\u003eThe results of the Adverse Sustainable Screening are incorporated into the final investment decision and, if materiality thresholds are exceeded, lead to our veto on sustainability grounds.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eStewardship\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eDriven by the market position we have gained and the resulting increase in social responsibility – but also by general social developments – our main endeavour is to use our own sphere of influence to make a significant corporate contribution to a sustainable environment and society.\u003c/p\u003e\n\u003cp\u003eThis includes using our own influence (stewardship) on third parties to optimise the overall long-term value, including shared economic, social and environmental values, on which the returns and interests of investors and beneficiaries depend.\u003c/p\u003e\n\u003cp\u003eThe following guideline describes how we as the Institutional Investment Group aim to exert a responsible influence in the interests of sustainability:\u003c/p\u003e\n\u003cp\u003e\u003ca href=\u0022/wp-content/uploads/2024/12/2023-10-31-2IG-Stewardship-Policy.pdf\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eStewardship Policy\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap\u0022\u003e\u003cdiv class=\u0022ip-nh-card\u0022\u003e\n\u003ch2\u003eSustainability in the remuneration policy\u003c/h2\u003e\n\u003cp\u003eOur sustainability beliefs have been a central component of our remuneration policy since the company was founded. This is especially true for employees with variable remuneration components, as compliance with our sustainability convictions becomes part of the annual individual targets. Variable remuneration components are not granted in the event of sustainability violations to the extent possible under labour law and depending on the significance of the violations; to this extent, sustainability violations are sanctioned monetarily. In addition, individual bonuses are sometimes agreed upon for the achievement of positively defined sustainability goals. In this way, we also want to give monetary value to significant sustainable action.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
