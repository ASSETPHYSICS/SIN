<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003ch1\u003eDatenschutzhinweise für Mieter\u003c/h1\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eDatenschutzhinweise für Mieter\u003c/p\u003e\n\u003cp\u003eDatenschutzhinweise nach Art. 13, 14 und 21 der Datenschutz-Grundverordnung (DSGVO) für Mieter von Immobilien, die von ServiceInvest Kapitalverwaltungsgesellschaft mbH handelnd für Rechnung der von ihr verwalteten Sondervermögen und verbundenen Objektgesellschaften gehalten werden.\u003c/p\u003e\n\u003cp\u003eMit der nachfolgenden Übersicht informieren wir Sie darüber, wie wir Ihre personenbezogenen Daten verarbeiten und welche Rechte Ihnen diesbezüglich aus den datenschutzrechtlichen Regelungen zustehen. Wir steht in diesem Dokument für die ServiceInvest Kapitalverwaltungsgesellschaft mbH (nachfolgend „SIN“), handelnd für Rechnung der von uns verwalteten Sondervermögen als Vermieter bzw. (indirekter) Eigentümer der Immobilie, aufgrund deren die maßgebliche Verarbeitung Ihrer Daten erfolgt (nachfolgend „Immobilie“).\u003c/p\u003e\n\u003cp\u003ePersonenbezogene Daten sind dabei alle Daten, die auf Sie persönlich beziehbar sind, bspw. Name, Adresse, E-Mail-Adresse, aber auch Ihre steuerlichen Daten und Kontendaten bzw. die entsprechenden Daten der Personen, die für Sie tätig werden, Artikel 4 Nr.1 DSGVO.\u003c/p\u003e\n\u003cp\u003eWir erhalten diese personenbezogenen Daten direkt von Ihnen oder von den Asset Managern ,Property/Facility Managern oder sonstigen Dienstleistern. Wir verarbeiten die Daten im Rahmen unserer Funktion als Vermieter bzw. wirtschaftlicher Eigentümer der Immobilie und als Kapitalverwaltungsgesellschaft des o.g. Sondervermögens.\u003c/p\u003e\n\u003ch2\u003e1. Name und Kontaktdaten des Verantwortlichen und Kontaktdaten des Datenschutzbeauftragten\u003c/h2\u003e\n\u003cp\u003eVerantwortlich für die Verarbeitung der von uns erhobenen oder an uns weitergeleiteten personenbezogenen Daten im Rahmen der Vermietung der Immobilie ist gemäß Art. 4 Abs. 7 DSGVO:\u003c/p\u003e\n\u003cp\u003eServiceInvest Kapitalverwaltungsgesellschaft mbH\u003cbr\u003ehandelnd für Rechnung der von ihr verwalteten Sondervermögen\u003cbr\u003eFürstenrieder Straße 61\u003cbr\u003e80686 München\u003cbr\u003eE-Mail: \u003ca href=\u0022mailto:datenschutz@serviceinvest.de\u0022\u003edatenschutz@serviceinvest.de\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDer Datenschutzbeauftragte ist:\u003cbr\u003eSascha Kremer, c/o KREMER LEGAL, Bahnhofstraße 66, 41236 Mönchengladbach, \u003ca href=\u0022mailto:sascha.kremer@kremer.legal\u0022\u003esascha.kremer@kremer.legal\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eBitte beachten Sie, dass Sie über Links auf unserer Website zu anderen Websites gelangen können, die nicht von uns, sondern von Dritten betrieben werden. Solche Links werden von uns entweder eindeutig gekennzeichnet oder sind durch einen Wechsel in der Adresszeile Ihres Browsers erkennbar. Für die Einhaltung der datenschutzrechtlichen Bestimmungen und einen sicheren Umgang mit Ihren personenbezogenen Daten auf diesen von Dritten betriebenen Websites sind wir nicht verantwortlich.\u003c/p\u003e\n\u003ch2\u003e2. Art der erhobenen Daten, Zwecke und Rechtsgrundlagen der Verarbeitung Ihrer personenbezogenen Daten\u003c/h2\u003e\n\u003cp\u003eIhre personenbezogenen Daten werden von uns im Einklang mit dem geltenden Datenschutzrecht, insbesondere der DSGVO und den nationalen Datenschutzregelungen zu folgenden Zwecken verarbeitet:\u003c/p\u003e\n\u003ch3\u003eErfüllung eines Vertrags oder Durchführung vorvertraglicher Maßnahmen (Art. 6 Abs. 1 b) DSGVO):\u003c/h3\u003e\n\u003cp\u003eWir verarbeiten personenbezogene Daten im Zusammenhang mit der (teilweisen) Vermietung der Immobilie an Sie. Bei der Vermietung der Immobilie handeln wir wirtschaftlich für Rechnung des Sondervermögens, an dem Anleger wirtschaftlich beteiligt sind. Unsere Verarbeitungstätigkeiten dienen der Vorbereitung, Durchführung und Erfüllung der Mietverträge zwischen Ihnen und uns (wir handelnd für Rechnung des Sondervermögens). Dabei verarbeiten wir folgende Ihrer personenbezogenen Daten:\u003c/p\u003e\n\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003eDaten zu Ihrer Person und/oder zu Personen, die für Sie tätig sind (Vornamen und Nachname, Geburtsdatum, Geburtsort und -land, Staatsangehörigkeit, Familienstand und Beruf);\u003c/li\u003e\u003cli\u003egegebenenfalls Personalausweisdaten/Reisepassdaten;\u003c/li\u003e\u003cli\u003eKontaktdaten (vorherige Wohn-/Geschäftsadresse, E-Mail-Adresse, Telefonnummer);\u003c/li\u003e\u003cli\u003eVerbrauchsdaten und Betriebskosten;\u003c/li\u003e\u003cli\u003eKontodaten;\u003c/li\u003e\u003cli\u003eDaten aus dem Mietvertrag;\u003c/li\u003e\u003cli\u003eKorrespondenz während des Mietverhältnisses.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eDie Datenverarbeitung dient der Vorbereitung, Durchführung, Erfüllung und Beendigung Ihres Mietvertrags. Wir erheben die personenbezogenen Daten in der Regel nicht bei Ihnen, sondern sie werden durch den Property Manager bzw. den Asset Manager an uns übermittelt. Es kann aber auch zu einer Erhebung von Daten direkt bei Ihnen oder zu einer Weiterleitung durch den Verwalter (Property/Facility Manager) oder andere im Rahmen des Mietverhältnisses beauftragte Dienstleister kommen, welche Ihre personenbezogenen Daten als allein Verantwortliche gemäß Art. 4 Nr. 7 DSGVO verarbeiten. Soweit dies für die oben genannten Zwecke erforderlich ist, erheben wir personenbezogene Daten von Dritten (bspw. Auskunfteien, wenn Mieten nicht gezahlt werden oder Schreiben nicht zugestellt werden können) oder aus öffentlich zugänglichen Quellen (bspw. Handels- und Melderegister).\u003c/p\u003e\n\u003ch3\u003eErfüllung einer rechtlichen Verpflichtung (Art. 6 Abs. 1 c) DSGVO):\u003c/h3\u003e\n\u003cp\u003eSofern erforderlich verarbeiten wir Ihre personenbezogenen Daten insbesondere zu Meldungen an Baubehörden, sonstige Meldebehörden, Aufsichtsbehörden und zu sonstigen aufsichtsrechtlich erforderlichen Zwecken. Dies umfasst insbesondere auch (soweit erforderlich) die geldwäscherechtliche Identifikation im Einklang mit unseren internen Richtlinien und den gesetzlichen Vorgaben. Überdies können wir aufgrund einer gerichtlichen Entscheidung (bspw. aufgrund eines gerichtlich durchgesetzten Informationsrechts) oder einer behördlichen Anordnung dazu verpflichtet sein, Ihre relevanten personenbezogenen Daten herauszugeben bzw. kann es erforderlich sein, personenbezogene Daten im Rahmen von behördlichen oder gerichtlichen Maßnahmen zu Zwecken der Beweiserhebung, Strafverfolgung oder Durchsetzung zivilrechtlicher Ansprüche offenzulegen (z.B. vor Gericht oder bei einer Staatsanwaltschaft). Außerdem sind wir verpflichtet, die Immobilie regelmäßig bewerten zu lassen. In diesem Zusammenhang erfolgt eine Übermittlung ausschließlich anonymisierter Informationen an das jeweilige Bewertungsunternehmen.\u003c/p\u003e\n\u003ch3\u003eVerfolgung berechtigter Interessen (Art. 6 Abs. 1 f) DSGVO):\u003c/h3\u003e\n\u003cp\u003eWir erheben von unseren Mietern bei Bedarf auch Bonitätsdaten, um das Risiko von Mietausfallschäden zu reduzieren. Darin liegt unser berechtigtes Interesse, weshalb die Verarbeitung dieser Daten nach Art. 6 Abs. 1 f) DSGVO nach einer entsprechenden Abwägung mit Ihren schutzwürdigen Interessen erlaubt ist. Des Weiteren besteht seitens der wirtschaftlichen Eigentümer des Fonds bzw. der Objektgesellschaften ein Interesse an Informationen, die in Zusammenhang mit der Vermietung (wie Daten aus dem Mietvertrag, Verbrauchsdaten und Betriebskosten) der Immobilie(n) stehen. Diese werden von uns jedoch ausschließlich anonymisiert bereitgestellt. Schließlich kann die Weitergabe bestimmter personenbezogener Daten an das jeweilige Bewertungsunternehmen (Immobilienbewertung durch ein externes Bewertungsunternehmen) erforderlich sein.\u003c/p\u003e\n\u003ch2\u003e3. Verarbeitung besonderer Kategorien personenbezogener Daten\u003c/h2\u003e\n\u003cp\u003eSofern erforderlich, kann der Verantwortliche die biometrischen Daten verarbeiten, die auf Ihren gegebenenfalls an uns in Kopie übermittelten Ausweisdokumenten enthalten sind (Lichtbild).\u003c/p\u003e\n\u003cp\u003eDiese Verarbeitung ist auf der Grundlage unserer geldwäscherechtlichen Verpflichtungen erforderlich, weil wir gesetzlich hierzu verpflichtet sind (Art. 6 Abs. 1 c), Art. 9 Abs. 2 g) DSGVO i.V.m. den nationalen geldwäscherechtlichen Vorschriften).\u003c/p\u003e\n\u003ch2\u003e4. Empfänger der personenbezogenen Daten\u003c/h2\u003e\n\u003cp\u003eAußer in den unter Ziffer 2 aufgeführten Fällen, sind Empfänger Ihrer Daten innerhalb unseres Unternehmens Beschäftigte, welche nach einem abgestuften Berechtigungskonzept Ihre Daten zu den oben genannten Zwecken verarbeiten.\u003c/p\u003e\n\u003cp\u003eDaneben können gegebenenfalls im Zuge einer Dienstleisterfunktion Dienstleister, die unsere Tätigkeit unterstützen, Ihre personenbezogenen Daten erhalten, wie z.B. IT-Service-Dienstleister. Alle unsere Dienstleister verarbeiten Daten ausschließlich innerhalb der Europäischen Union (EU) oder des Europäischen Wirtschaftsraum (EWR) und werden vertraglich zu angemessenen technischen und organisatorischen Maßnahmen zur Gewährleistung des Datenschutzes sowie zur Wahrung der Vertraulichkeit personenbezogener Daten verpflichtet.\u003c/p\u003e\n\u003cp\u003eWir geben Ihre personenbezogenen Daten zu den in Ziffer 2 genannten Zwecken und ausschließlich beim Vorliegen einer gesetzlichen Erlaubnis an verbundene Unternehmen weiter, die unsere Tätigkeit unterstützen, ferner an staatliche Stellen. Darüber hinaus werden wir Ihre personenbezogenen Daten im Rahmen unserer Verarbeitung an Dritte weitergeben, insbesondere an IT-Dienstleister, externe Rechenzentren, Verwahrstellen, Wirtschaftsprüfer, Steuerberater, Rechtsanwälte und finanzierende Banken.\u003c/p\u003e\n\u003cp\u003eEine Übermittlung Ihrer personenbezogenen Daten in ein Land außerhalb der EU bzw. des EWR (sog. Drittland, bspw. in die USA) erfolgt grundsätzlich nur, soweit die Übermittlung zur Erfüllung der mit Ihnen abgeschlossenen Verträge erforderlich oder aufgrund wichtiger Gründe des öffentlichen Interesses notwendig ist (beispielsweise für die Erfüllung steuerlicher Meldepflichten).\u003c/p\u003e\n\u003ch2\u003e5. Dauer, für die die personenbezogenen Daten gespeichert werden\u003c/h2\u003e\n\u003cp\u003eWir speichern Ihre personenbezogenen Daten für die Dauer des Mietverhältnisses. Nach Beendigung des Mietverhältnisses und Erfüllung aller Pflichten aus dem Mietverhältnis werden Ihre personenbezogenen Daten gelöscht, es sei denn, ihre weitere Speicherung ist erforderlich, um handels- und steuerrechtliche oder aufsichtsrechtliche Aufbewahrungspflichten nach den europäischen und nationalen Gesetzen sowie nationalen Verordnungen und Rundschreiben zu erfüllen. Außerdem dürfen wir Ihre Daten weiter speichern, wenn dies zur Erhaltung von Beweismitteln im Rahmen der Verjährungsvorschriften erforderlich ist.\u003c/p\u003e\n\u003cp\u003eDie handels- und steuerrechtlichen Aufbewahrungsfristen betragen bis zu zehn Jahre nach vollständiger Beendigung der Vertragsbeziehung. Zudem beurteilt sich die Speicherdauer auch nach den gesetzlichen Verjährungsfristen, die z.B. in Deutschland häufig drei (3) Jahre ab dem Ende eines Kalenderjahres, in gewissen Fällen aber auch bis zu dreißig Jahre betragen können. Nach Ablauf der jeweiligen Speicherdauer werden Ihre personenbezogenen Daten gelöscht.\u003c/p\u003e\n\u003ch2\u003e6. Verpflichtung zur Bereitstellung; mögliche Folgen der Nichtbereitstellung\u003c/h2\u003e\n\u003cp\u003eEs besteht keine allgemeine Verpflichtung, uns personenbezogene Daten zur Verfügung zu stellen. Die Bereitstellung personenbezogener Daten ist aber zum Teil gesetzlich vorgeschrieben oder vertraglich erforderlich (siehe oben Ziffer 2). Verweigern Sie uns die Verarbeitung Ihrer Daten, die wir zur Vertragserfüllung oder wegen einer gesetzlichen Anordnung brauchen, kann es sein, dass der Vertrag nicht in der beabsichtigten Weise geschlossen werden oder gekündigt werden kann.\u003c/p\u003e\n\u003ch2\u003e7. Rechte der betroffenen Personen\u003c/h2\u003e\n\u003cp\u003eSie haben das Recht, aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit gegen die Verarbeitung der Sie betreffenden personenbezogenen Daten, die aufgrund von Art. 6 Abs. 1 S. 1 f) DSGVO erfolgt, Widerspruch einzulegen. Der Widerspruch kann formfrei erfolgen. Sie können im Übrigen folgende Rechte uns gegenüber geltend machen:\u003c/p\u003e\n\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003eRecht auf Auskunft (Art. 15 DSGVO);\u003c/li\u003e\u003cli\u003eRecht auf Berichtigung oder Löschung (Art. 16 und 17 DSGVO);\u003c/li\u003e\u003cli\u003eRecht auf Einschränkung der Verarbeitung (Art. 18 DSGVO);\u003c/li\u003e\u003cli\u003eRecht auf Datenübertragbarkeit (Art. 20 DSGVO);\u003c/li\u003e\u003cli\u003eBeschwerderecht bei einer Datenschutz-Aufsichtsbehörde (Art. 77 DSGVO).\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eBitte wenden Sie sich zur Geltendmachung Ihrer Rechte möglichst zunächst an:\u003cbr\u003eServiceInvest Kapitalverwaltungsgesellschaft mbH\u003cbr\u003ehandelnd für Rechnung der von ihr verwalteten Sondervermögen\u003cbr\u003eFürstenrieder Straße 61\u003cbr\u003e80686 München\u003cbr\u003eE-Mail: \u003ca href=\u0022mailto:datenschutz@serviceinvest.de\u0022\u003edatenschutz@serviceinvest.de\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eDas in der Fußzeile angegebene Datum gibt das Datum der letzten Überarbeitung an. lm Falle einer wesentlichen Änderung werden wir Ihnen die jeweils aktuelle Version der Datenschutzhinweise gesondert per Post bzw. E-Mail zur Verfügung stellen. Die aktuellste Version kann zudem jederzeit bei uns angefragt werden.\u003c/p\u003e\n\u003cp class=\u0022ip-note-line\u0022\u003eStand: März 2026\u003c/p\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
