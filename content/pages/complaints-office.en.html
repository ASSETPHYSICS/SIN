<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003ch1\u003eComplaints Office for Fund Investors\u003c/h1\u003e\u003cp class=\u0022ip-lead\u0022\u003eof ServiceInvest Kapitalverwaltungsgesellschaft mbH (\u0022ServiceInvest\u0022)\u003c/p\u003e\u003cp\u003eWe attach great importance to the satisfaction of our customers. It is therefore important to us to give you the opportunity to voice criticism. With this in mind, ServiceInvest has set up a complaints office for its fund investors, which they can contact if they have a complaint or wish to voice criticism.\u003c/p\u003e\u003cp\u003eIn the event that you have criticism and you inform us of it, we will confirm receipt of your complaint quickly and process it promptly. We will then inform you about the further procedure regarding your concern. The processing will of course be free of charge for you. You can write your complaint in German or English.\u003c/p\u003e\u003cp\u003ePlease send your criticism preferably by email to the following address: \u003ca href=\u0022mailto:beschwerdestelle@serviceinvest.de\u0022\u003ebeschwerdestelle@serviceinvest.de\u003c/a\u003e\u003c/p\u003e\u003cp\u003eYou may also send your criticism by post to the following address:\u003c/p\u003e\u003cp\u003eServiceInvest Kapitalverwaltungsgesellschaft\u003cbr\u003eComplaints Office\u003cbr\u003eFürstenrieder Strasse 61\u003cbr\u003e80686 Munich\u003c/p\u003e\u003cp\u003eYou can reach us by phone from Monday to Friday on working days in Bavaria from 10:00 to 12:00 and from 14:00 to 16:00 under the number \u003ca href=\u0022tel:+49895443440\u0022\u003e+49 (0) 89 – 54 43 44-0\u003c/a\u003e.\u003c/p\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
