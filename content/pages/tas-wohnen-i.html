<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003cp class=\u0022ip-strong\u0022\u003eOffenlegung von Produktinformationen für Finanzprodukte, mit denen ökologische oder soziale Merkmale beworben werden, auf der Internetseite\u003c/p\u003e\u003cp\u003ebetreffend den offenen inländischen Spezial-AIF mit festen Anlagebedingungen in Form eines Spezial-Sondervermögens mit dem Investitionsschwerpunkt Immobilien und der Bezeichnung\u003c/p\u003e\u003cp class=\u0022ip-strong\u0022\u003e“TAS Wohnen I“.\u003c/p\u003e\u003ch2\u003ea) Zusammenfassung\u003c/h2\u003e\u003cp\u003eDas Finanzprodukt (der „Fonds“) bewirbt ökologische Merkmale, hat aber kein nachhaltiges Investitionsziel. Die diesem Finanzprodukt zugrunde liegenden Investitionen berücksichtigen nicht die EU-Kriterien für ökologisch nachhaltige Wirtschaftsaktivitäten im Sinne der Taxonomie-Verordnung. Der Fonds leistet einen Beitrag zu den folgenden Umwelteigenschaften, in dem er die folgenden Kriterien verbindlich verfolgt:\u003c/p\u003e\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003eKlimaschutz,\u003c/li\u003e\u003cli\u003eVerminderung der Umweltverschmutzung,\u003c/li\u003e\u003cli\u003eSchutz und der Wiederherstellung der Biodiversität und Ökosysteme.\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003eb) Kein nachhaltiges Investitionsziel\u003c/h2\u003e\u003cp\u003eMit diesem Finanzprodukt werden ökologische oder soziale Merkmale beworben, aber keine nachhaltigen Investitionen angestrebt.\u003c/p\u003e\u003ch2\u003ec) Ökologische oder soziale Merkmale des Finanzprodukts\u003c/h2\u003e\u003cp\u003eDie ökologischen Merkmale, die der Fonds im Rahmen seiner Immobilieninvestitionen berücksichtigt, sind die Leistung eines Beitrags zum Klimaschutz, der Verminderung von Umweltverschmutzung sowie der Schutz und Wiederherstellung der Biodiversität und der Ökosysteme. Das Finanzprodukt investiert ausschließlich in Wohnimmobilien in Deutschland. Im Rahmen der Auswahl und Verwaltung der Vermögenswerte werden eine hohe Energieeffizienz auf Gebäudeebene sowie die Vermeidung von CO2-Emissionen durch Prüfung im Ankaufsprozess (ESG-Assessment sowie Erstellung bzw. Überprüfung der Energieausweise gemäß der Energieeinsparverordnung) sichergestellt (Beitrag Klimaschutz). CO2-Emissionen (am Wohnobjekt) werden durch die Bevorzugung von Fernwärme sowie den Bezug von Grünstrom für die Allgemeinflächen auf Objektebene verringert (Beitrag Verminderung von Umweltverschmutzung). Darüber hinaus wird bei den Investitionen ein zusätzlicher Flächenverbrauch und -versiegelung grundsätzlich vermieden und die Förderung der Biodiversität an den Objekten durch die Herstellung von Gründächern gefördert (Beitrag Schutz und Wiederherstellung der Biodiversität und der Ökosysteme).\u003c/p\u003e\u003ch2\u003ed) Anlagestrategie\u003c/h2\u003e\u003cp\u003eUnter Berücksichtigung seiner Allgemeinen und Besonderen Anlagebedingungen sowie seiner Anlagestrategie strebt der Fonds den Aufbau eines diversifizierten Portfolios von Wohnimmobilien mit hoher ökologischer und funktionaler Qualität an. Alle potenziellen Investitionen, die für den Fonds in Betracht gezogen werden, werden einer detaillierten ESG-Bewertung (durch ein spezialisiertes Ingenieurbüro) und einer Due-Diligence-Prüfung unterzogen, bevor eine Investitionsentscheidung getroffen wird, um sicherzustellen, dass sie die für den Fonds geltenden ESG-Kriterien erfüllen. Investitionen, die im Hinblick auf die ESG-Kriterien des Fonds als risikoreich eingestuft werden, werden nicht weiterverfolgt, es sei denn, es ergeben sich neue Informationen, die die Einstufung der Investition ändern würden. Es werden Investitionen in Immobilien ausgeschlossen, die im Zusammenhang mit der Gewinnung, der Lagerung, dem Transport oder der Herstellung von fossilen Brennstoffen stehen. Dies gilt auch für die Investition in Immobilien mit schlechter Energieeffizienz, soweit keine glaubwürdige Strategie zur Klimaneutralität bzw. Vermeidung der schlechten Energieeffizienz vorliegt. Das Finanzprodukt plant ausschließlich Investments in Immobilien und u.U. Immobilien-Gesellschaften, deren Geschäftsumfang sich grundsätzlich auf das Halten und Verwalten von Immobilien beschränkt und die keine Arbeitnehmer haben. An gewerblichen Unternehmen wird sich das Finanzprodukt nicht beteiligen, weshalb eine entsprechende Bewertung der Good-Governance-Praktiken nicht erforderlich ist.\u003c/p\u003e\u003ch2\u003ee) Aufteilung der Investitionen\u003c/h2\u003e\u003cp\u003eDer größte Anteil der Investitionen wird in Wohnimmobilien in Deutschland getätigt, die die geförderten Umweltkriterien erfüllen. Ein gewerblicher Anteil von max. 15% ist auf Portfolioebene vorgesehen. Für Investitionen, die nicht den geförderten Umweltkriterien entsprechen, gilt eine De-minimis-Schwelle von 25%. Außerdem beträgt der Mindestanteil von Investitionen, die sich an der EU-Taxonomie orientieren, 0%. Folglich beträgt der Anteil der Investitionen in fossile Gas- oder Kernenergieaktivitäten, die mit der EU-Taxonomie übereinstimmen, ebenfalls 0 %. Der Fonds wird in Übereinstimmung mit den Anlagebedingungen keine Derivate einsetzen.\u003c/p\u003e\u003ch2\u003ef) Überwachung der ökologischen oder sozialen Merkmale\u003c/h2\u003e\u003cp\u003eDer Fonds wird ausschließlich in Wohnimmobilien investieren und überprüft im Ankaufsprozess die ESG-Strategiekonformität i.R. der technischen Due Diligence, die von einem ESG-Assessment begleitet sowie bedarfsweise von einer Umwelt-Due Diligence ergänzt wird. Darin berücksichtigt und enthalten sind die Nachhaltigkeitsindikatoren betreffend Energieeffizienz, Vermeidung von CO2-Emissionen (Allgemeinflächen), Reduzierung von CO2-Emissionen (Objektebene), betreffend die Reduzierung von Flächenverbrauch/Flächenversiegelung, sowie betreffend die Förderung der Biodiversität durch Herstellung von Gründächern.\u003c/p\u003e\u003ch2\u003eg) Methoden\u003c/h2\u003e\u003cp\u003eEs werden Technische Due Diligence-Prüfungen sowie bedarfsweise Umwelt-Due Diligence-Prüfungen, ESG-Assessments, die Erstellung bzw. Überprüfung des Energieausweises nach den Vorgaben der jeweils aktuellen Energieeinsparverordnung (EnEV), sowie die Analyse von Versorgungsverträgen (ggf. mit anschließender Vertragsverhandlung bzw. -umstellung) als Methoden eingesetzt.\u003c/p\u003e\u003ch2\u003eh) Datenquellen und ‑verarbeitung\u003c/h2\u003e\u003cp\u003eIm Ankaufsprozess werden zunächst immobilienspezifische Daten verwendet, die durch den Verkäufer des jeweiligen Objektes zur Verfügung gestellt werden. Üblicherweise erfolgt dies über einen digitalen Datenraum, dessen Inhalte Bestandteil des Kaufvertrags werden. Die Daten werden i.R. einer Technical, Legal, Tax sowie Economical Due Diligence überprüft und plausibilisiert. Die einzelnen Due Diligence-Prozesse werden die jeweils von Fachspezialisten wie z.B. Ingenieuren, Rechtsanwälten, Steuerberatern und Wirtschaftsprüfern durchgeführt. In der Bewirtschaftungsphase werden Daten durch das jeweilige Versorgungsunternehmen, z.B. ein Stadtwerk, bereitgestellt. Da für einen Großteil der für das Finanzprodukt bestimmten Nachhaltigkeitsindikatoren jeweils ein Ja-/Nein-Kriterium definiert ist, kann eine hohe Aussagefähigkeit und Eindeutigkeit erreicht werden. Auf Schätzungen kann daher weitgehend verzichtet werden.\u003c/p\u003e\u003ch2\u003ei) Beschränkungen hinsichtlich der Methoden und Daten\u003c/h2\u003e\u003cp\u003eEs wurden keine Beschränkungen identifiziert.\u003c/p\u003e\u003ch2\u003ej) Sorgfaltspflicht\u003c/h2\u003e\u003cp\u003eAlle Investitionen des Fonds werden in der Ankaufs Due-Diligence-Phase (und fortlaufend während der Verwaltung) auf verschiedene ESG-Aspekte überprüft, um sicherzustellen, dass Akquisitionen den festgelegten ESG-Standards entsprechen. Die Ergebnisse der ESG-Due Diligence werden zur Bewertung der Investitionen herangezogen.\u003c/p\u003e\u003ch2\u003ek) Mitwirkungspolitik\u003c/h2\u003e\u003cp\u003eDas Finanzprodukt plant ausschließlich Investments in Immobilien und u.U. Immobilien-Gesellschaften, die keinen eigenen operativen Geschäftsbetrieb führen. An gewerblichen Unternehmen wird sich das Finanzprodukt nicht beteiligen, weshalb das Thema Mitwirkungspolitik für dieses Finanzprodukt nicht relevant ist.\u003c/p\u003e\u003ch2\u003el) Bestimmter Referenzwert\u003c/h2\u003e\u003cp\u003eEs wurde kein Referenzindex bestimmt.\u003c/p\u003e\u003cp\u003eDiese Produktangaben wurden initial am 18.04.2023 veröffentlicht.\u003c/p\u003e\u003ch3\u003eÄnderungshistorie:\u003c/h3\u003e\u003cp\u003e19.06.2024: Ergänzung der ISIN-Nummer des Fonds, des initialen Veröffentlichungsdatums, sowie Aufnahme einer Änderungshistorie.\u003c/p\u003e\u003cul class=\u0022ip-dls\u0022\u003e\u003cli\u003e\u003ca class=\u0022ip-dl\u0022 href=\u0022/wp-content/uploads/offenlegung/2024-06-19-VOe_Internetseite-Art.-10-SFDR-TAS-Wohnen-I-c.pdf\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eFondsbeschreibung TAS Wohnen I (PDF)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca class=\u0022ip-dl\u0022 href=\u0022/wp-content/uploads/offenlegung/2024-04-19-website-disclosure-Art.-10-SFDR-TAS-Wohnen-I-c.pdf\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eProduct disclosure TAS Wohnen I (PDF, englisch)\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
