<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv id=\u0022ueberzeugung\u0022 class=\u0022ip-wrap ip-grid ip-grid\u002d\u002dsplit\u0022\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eOur promise\u003c/p\u003e\n\u003ch2\u003eTransparency, control and efficiency in Real Assets investment.\u003c/h2\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eReal Assets require a long-term perspective, robust structures and a clear overview of risks, responsibilities and developments. At the same time, the demands placed on administration, risk management, reporting and regulation are increasing. We support institutional investors in focusing on what matters most, making clear decisions and maintaining a clear overview at all times.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eWhat sets us apart\u003c/p\u003e\n\u003cul class=\u0022ip-list\u0022\u003e\n\u003cli\u003e\u003ch3\u003eFirst-hand experience\u003c/h3\u003e\u003cp\u003eWe understand the perspectives of investors, Asset Managers and governing bodies. This enables us to develop solutions that work in practice and facilitate well-informed decisions.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003ch3\u003eTechnology as a lever\u003c/h3\u003e\u003cp\u003eDigital processes reduce manual effort, improve data quality and create transparency for investors, committees and supervisory bodies.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003ch3\u003eHolistic platform\u003c/h3\u003e\u003cp\u003eAdministration, regulation and advisory services are seamlessly integrated. This establishes clear lines of responsibility, reduces the need for coordination and enhances the ability to manage complex Real Asset structures.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv id=\u0022gruppe\u0022 class=\u0022ip-wrap ip-grid ip-grid\u002d\u002dsplit\u0022\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eThe Group\u003c/p\u003e\n\u003ch2\u003eInstitutional Solutions Division of the Institutional Investment Group\u003c/h2\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eInstitutional Investment Partners GmbH, Institutional Investment Partners S.à.r.l. and Institutional Investment Consulting Partners GmbH form the Investor Solutions Division of the Institutional Investment Group (2IG). It brings together all of 2IG’s services aimed directly at institutional investors.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp\u003eThe Institutional Investment Group (2IG) is one of the leading independent investor platforms for Real Asset investments in Germany and Europe. Through its Investor Solutions Division and Asset Servicing Division, 2IG specialises in services for institutional real asset funds governed by German and Luxembourg law.\u003c/p\u003e\n\u003cp\u003eWith more than 350 employees, 2IG manages over 50 billion euros’ worth of property assets in around 25 countries, thereby occupying a market-leading position in the administration of Real Assets.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e100% independent of banks, insurance companies, other professional property owners and Asset Managers.\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\u0022ip-group-link\u0022\u003e\u003ca href=\u0022https://www.2ig.de\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003e→ www.2ig.de\u003c/a\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
