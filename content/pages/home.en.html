<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv id=\u0022gruppe\u0022 class=\u0022ip-wrap ip-grid ip-grid\u002d\u002dsplit\u0022\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eThe Institutional Investment Group\u003c/p\u003e\n\u003ch2\u003eExcellence in fund administration.\u003c/h2\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eServiceInvest Kapitalverwaltungsgesellschaft mbH is part of the Institutional Investment Group (2IG), one of the leading independent administration platforms for property investments in Germany and Europe. 2IG specialises in services for institutional property funds governed by German and Luxembourg law. With more than 350 employees, 2IG manages over 50 billion euros’ worth of property assets across approximately 25 countries, thereby occupying a market-leading position in the administration of property assets.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003ch3\u003eThe Asset Servicing Division\u003c/h3\u003e\n\u003cp\u003eThe Asset Servicing Division brings together all of 2IG’s KVG insourcing services. The division’s three units – ServiceInvest Kapitalverwaltungsgesellschaft, acb and CONNOS – provide property managers and asset management companies with complex middle and back office services such as risk management and control, fund accounting, investor reporting and regulatory reporting.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWe are 100% independent of banks, insurance companies, other professional property owners and Asset Managers.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThanks to the high level of specialisation within these units and the AIFMControl software suite – developed specifically for property asset management companies and serving as the backbone of a high-performance, integrated IT platform – the range of services offered by 2IG’s Asset Servicing Division is highly scalable and creates scope for growth for our clients.\u003c/p\u003e\n\u003cp class=\u0022ip-group-link\u0022\u003e\u003ca href=\u0022#leistungen\u0022\u003e→ Our services\u003c/a\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
<!-- /wp:divi/column -->

<!-- /wp:divi/section -->
<!-- wp:divi/section {"module":{"meta":{"adminLabel":{"desktop":{"value":"Unsere Vision"}}},"decoration":{"spacing":{"desktop":{"value":{"padding":{"top":"0px","bottom":"0px","left":"0px","right":"0px","syncVertical":"on","syncHorizontal":"on"}}}},"layout":{"desktop":{"value":{"display":"block"}}},"attributes":{"desktop":{"value":{"attributes":[{"id":"ipc-ip-sec ip-sec\u002d\u002dmist","name":"class","value":"ip-divi-sec ip-sec ip-sec\u002d\u002dmist","adminLabel":"class","targetElement":"main"}]}}}}},"builderVersion":"5.0.0-public-beta.2"} -->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv id=\u0022vision\u0022 class=\u0022ip-wrap ip-grid ip-grid\u002d\u002dsplit\u0022\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eOur vision\u003c/p\u003e\n\u003ch2\u003eUnleash Capacities\u003c/h2\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eThe digitalisation of the capital markets is advancing at an ever-faster pace, whilst regulatory requirements are constantly increasing. We are convinced that these growing challenges can only be met through an increasing division of labour between Asset Managers and specialised administrative service providers.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp\u003eThe Real Assets sector is following in the footsteps of the securities sector, where a high degree of division of labour has long been established and proven effective. However, property investments in particular bring with them their own unique complexities and high demands.\u003c/p\u003e\n\u003cp\u003eWe guide our clients step by step into this digital future of the Real Assets market.\u003c/p\u003e\n\u003cp\u003eOur clients should be able to focus entirely on their core competence: asset management. The capacity freed up for them through our scalable services should be available for further growth in their core areas of expertise, rather than being tied up in administrative tasks.\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
<!-- /wp:divi/column -->
<!-- /wp:divi/row -->
<!-- /wp:divi/section -->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv id=\u0022leistungen\u0022 class=\u0022ip-wrap\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eOur services\u003c/p\u003e\n\u003ch2\u003eKVG insourcing via authorised KVGs\u003c/h2\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eTogether with other highly specialised companies within 2IG’s Asset Servicing Division, ServiceInvest offers Asset Managers and capital management companies not only the launch of partner funds but also the provision of specific middle and back office service packages – known as KVG insourcing.\u003c/p\u003e\n\u003cp class=\u0022ip-intro\u0022\u003eAs a licensed capital management company under Section 22 of the German Capital Management Act (KAGB), we are able to offer our clients the insourcing of services within a fully regulated framework, which significantly simplifies outsourcing control for our clients.\u003c/p\u003e\n\u003cdiv class=\u0022ip-values ip-values\u002d\u002d3\u0022\u003e\n\u003carticle\u003e\u003ch3\u003eFund and corporate accounting\u003c/h3\u003e\u003cp\u003eWe offer Asset Managers and their capital management companies fully digital fund and corporate accounting based on a centralised data repository. In doing so, we translate international accounting standards (local GAAP) into German investment law. As all accounting entries are generated entirely within the system, our clients benefit from seamless data tracing and full transparency into their funds.\u003c/p\u003e\u003c/article\u003e\n\u003carticle\u003e\u003ch3\u003eregulatory reporting\u003c/h3\u003e\u003cp\u003eUsing our unique management software, AIFMControl, we generate the mandatory XML reports for the Bundesbank and BaFin, as well as any other reports required by other authorities and associations, at the touch of a button. We also meet the indirect reporting requirements of institutional investors – for example, under Solvency II, GroMiKV or CRR – in a timely and convenient manner.\u003c/p\u003e\u003cp\u003eFurther information: \u003ca href=\u0022https://fund-reporting.com\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003efund-reporting.com\u003c/a\u003e\u003c/p\u003e\u003c/article\u003e\n\u003carticle\u003e\u003ch3\u003einvestor reporting\u003c/h3\u003e\u003cp\u003eWe automatically generate the quantitative sections of monthly, quarterly, half-yearly and annual reports in our clients’ corporate design; clients then simply need to add qualitative sections, such as market reports or management commentary, within the reporting system (AIFMC). On request, we also produce customised reports tailored to the requirements of specific target groups.\u003c/p\u003e\u003c/article\u003e\n\u003carticle\u003e\u003ch3\u003eRisk management\u003c/h3\u003e\u003cp\u003eUsing our AIFMControl management software, we offer our clients comprehensive support in risk management and control. This applies to the development and formulation of risk strategy, as well as to risk inventory (creation of risk atlases and catalogues for each AIF) and the definition of thresholds and the risk-bearing capacity concept.\u003c/p\u003e\u003cp\u003eWe provide the quantitative basis for effective risk management and support the corresponding management of risk mitigation measures with our software. A comprehensive claims database and the automatic generation of risk reports and regulatory-compliant documentation round off our services.\u003c/p\u003e\u003c/article\u003e\n\u003carticle\u003e\u003ch3\u003eHedging Services\u003c/h3\u003e\u003cp\u003eIn addition to quantitative risk management, the Asset Servicing Division also offers hedging management services. These include, in particular, advisory services on the set-up of hedging transactions, trading support for OTC derivatives and underlying transactions (including contract management), as well as valuation services within a holistically coordinated process landscape. These services are complemented by the corresponding risk management, liquidity management and reporting of these assets.\u003c/p\u003e\u003c/article\u003e\n\u003carticle\u003e\u003ch3\u003epartner funds\u003c/h3\u003e\u003cp\u003eWe also offer our fund partners who do not have their own KVG the design, launch and management of property AIFs. Together with our clients, we identify the appropriate structure and, in close consultation with the supervisory authorities, ensure the fund is launched swiftly.\u003c/p\u003e\u003c/article\u003e\n\u003c/div\u003e\n\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv id=\u0022unterschied\u0022 class=\u0022ip-wrap ip-grid ip-grid\u002d\u002dsplit\u0022\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eAsset Servicing Division\u003c/p\u003e\n\u003ch2\u003eWhat sets us apart.\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv class=\u0022ip-col\u0022\u003e\n\u003cul class=\u0022ip-list\u0022\u003e\n\u003cli\u003e\u003ch3\u003eExperienced onboarding team\u003c/h3\u003e\u003cp\u003eAs the only insourcing provider, 2IG’s Asset Servicing Division has an onboarding team with experience of setting up around 20 asset management companies and the corresponding proven process and organisational expertise – with a focus on both economic efficiency and current regulatory requirements. This ensures that even the migration of large data sets is carried out securely and that internal and external processes are optimally coordinated.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003ch3\u003eInsourcing Management as a SPOC\u003c/h3\u003e\u003cp\u003eThe insourcing manager acts as the single point of contact (SPOC) to ensure smooth collaboration.\u003c/p\u003e\u003cp\u003eThey monitor and support the agreed Service Level Agreements (SLAs) using defined Key Performance Indicators (KPIs) and simplify our clients’ outsourcing management with regular SLA/KPI reports.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003ch3\u003eIntegrated IT platform\u003c/h3\u003e\u003cp\u003eThe tried-and-tested AIFMControl suite provides a unique IT platform developed specifically for the management of property funds. Both the client and ServiceInvest access a centralised data repository via AIFMControl. This integrated IT system ensures seamless communication between all parties involved, enabling comprehensive data tracing – which is of significant regulatory value – and full transparency for the client.\u003c/p\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv id=\u0022nutzen\u0022 class=\u0022ip-wrap\u0022\u003e\n\u003cp class=\u0022ip-kicker \u0022\u003eYour benefits\u003c/p\u003e\n\u003ch2\u003eYour benefits as our customer.\u003c/h2\u003e\n\u003cdiv class=\u0022ip-figures\u0022\u003e\n\u003carticle class=\u0022ip-figure\u0022\u003e\u003cspan class=\u0022ip-figure__value\u0022\u003e100%\u003c/span\u003e\u003ch3\u003eTransparency \u0026amp; scalability\u003c/h3\u003e\u003cp\u003eWith their own asset management company, our clients retain control over their funds and data; we ensure transparency and scalability.\u003c/p\u003e\u003c/article\u003e\n\u003carticle class=\u0022ip-figure\u0022\u003e\u003cspan class=\u0022ip-figure__value\u0022\u003e100%\u003c/span\u003e\u003ch3\u003eCentralised platform\u003c/h3\u003e\u003cp\u003eOur clients receive a unique, centralised and audit-proof platform for data, processes, reporting and disclosure that meets national and international requirements.\u003c/p\u003e\u003c/article\u003e\n\u003carticle class=\u0022ip-figure\u0022\u003e\u003cspan class=\u0022ip-figure__value\u0022\u003e100%\u003c/span\u003e\u003ch3\u003eFocus on core competencies\u003c/h3\u003e\u003cp\u003eOur clients are given the freedom and assurance to focus fully on their core competence: property management.\u003c/p\u003e\u003c/article\u003e\n\u003c/div\u003e\n\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
