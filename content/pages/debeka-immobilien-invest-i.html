<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003cp class=\u0022ip-strong\u0022\u003eOffenlegung von Produktinformationen für Finanzprodukte, mit denen ökologische oder soziale Merkmale beworben werden, auf der Internetseite\u003c/p\u003e\u003cp\u003ebetreffend den offenen inländischen Spezial-AIF mit festen Anlagebedingungen in Form eines Spezial-Sondervermögens mit dem Investitionsschwerpunkt Immobilien und der Bezeichnung\u003c/p\u003e\u003cp class=\u0022ip-strong\u0022\u003eDebeka Immobilien Invest I\u003c/p\u003e\u003ch2\u003eZusammenfassung\u003c/h2\u003e\u003cp\u003eDer Debeka Immobilien Invest I (der „Fonds“) bewirbt ökologische und soziale Merkmale und wird gemäß der Verordnung (EU) 2019/2088 („SFDR“) als Finanzprodukt im Sinne von Artikel 8 eingestuft. Der Fonds verfolgt keine nachhaltigen Investitionen im Sinne der SFDR oder im Sinne der Verordnung (EU) 2020/852 („TVO“).\u003c/p\u003e\u003cp\u003eDer Fonds investiert in energieeffiziente Gebäude bzw. verbessert deren Energieeffizienz um den Klimaschutz zu fördern. Zudem fördert er bezahlbares Wohnen sowie die Versorgung von Einrichtungen für qualitativ hochwertige Bildung. Mindestens 75% der Anlagen müssen mindestens eins der beworbenen Merkmale erfüllen.\u003c/p\u003e\u003cul class=\u0022ip-dls\u0022\u003e\u003cli\u003e\u003ca class=\u0022ip-dl\u0022 href=\u0022/wp-content/uploads/offenlegung/Debeka-Immo-Invest-Entwurf-VOe_Internetseite-Art.-10-SFDR_Art_8-c-final.pdf\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eVollständige Fondsbeschreibung Debeka Immobilien Invest I (PDF)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca class=\u0022ip-dl\u0022 href=\u0022/wp-content/uploads/offenlegung/Debeka-Immo-Invest-Entwurf-VOe_Internetseite-Art.10-SFDR-english.pdf\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eDisclosure of product information Debeka Immobilien Invest I (PDF, english)\u003c/a\u003e\u003
