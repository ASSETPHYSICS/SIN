<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003ch1\u003eBeschwerdestelle für Fondsanleger\u003c/h1\u003e\u003cp class=\u0022ip-lead\u0022\u003eder ServiceInvest Kapitalverwaltungsgesellschaft mbH („ServiceInvest“)\u003c/p\u003e\u003cp\u003eDer Zufriedenheit unserer Kunden messen wir eine zentrale Bedeutung bei. Daher ist es uns wichtig, Ihnen die Möglichkeit zu geben, Kritik zu äußern. Vor diesem Hintergrund hat die ServiceInvest für ihre Fondsanleger eine Beschwerdestelle eingerichtet, an welche sie sich in den Fällen wenden können, dass sie sich beschweren oder Kritik äußern möchten.\u003c/p\u003e\u003cp\u003eFür den Fall, dass Sie Kritik haben und uns diese mitteilen, werden Ihnen den Eingang Ihrer Beschwerde zügig bestätigen und diese zeitnah bearbeiten. Im Anschluss werden wir Sie über die weitere Verfahrensweise bzgl. Ihres Anliegens informieren. Die Bearbeitung erfolgt für Sie selbstverständlich kostenfrei. Die Beschwerde können Sie in deutscher oder englischer Sprache verfassen.\u003c/p\u003e\u003cp\u003eBitte richten Sie Ihre Kritik bevorzugt via E-Mail an folgende Adresse: \u003ca href=\u0022mailto:beschwerdestelle@serviceinvest.de\u0022\u003ebeschwerdestelle@serviceinvest.de\u003c/a\u003e\u003c/p\u003e\u003cp\u003eZudem steht Ihnen der Postweg offen, so dass Sie gerne Kritik auch an folgende Adresse senden können:\u003c/p\u003e\u003cp\u003eServiceInvest Kapitalverwaltungsgesellschaft\u003cbr\u003eBeschwerdestelle\u003cbr\u003eFürstenrieder Straße 61\u003cbr\u003e80686 München\u003c/p\u003e\u003cp\u003eTelefonisch erreichen Sie uns von Montag bis Freitag an Arbeitstagen in Bayern grundsätzlich von 10:00 Uhr bis 12:00 Uhr und von 14:00 bis 16:00 Uhr unter der Nummer \u003ca href=\u0022tel:+49895443440\u0022\u003e+49 (0) 89 – 54 43 44-0\u003c/a\u003e.\u003c/p\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
