<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003ch1\u003eVergütungspolitik\u003c/h1\u003e\u003cp class=\u0022ip-lead\u0022\u003eServiceInvest Kapitalverwaltungsgesellschaft mbH\u003c/p\u003e\u003ch2\u003eVergütungssystematik\u003c/h2\u003e\u003cp\u003eZentrales Element der Vergütungspolitik ist die konsequente Ausrichtung des Vergütungssystems an den strategischen Unternehmenszielen der Gesellschaft in Verbindung mit der Leistung der einzelnen Mitarbeiter\u003csup\u003e\u003ca href=\u0022#fn1\u0022 id=\u0022fnref1\u0022\u003e[1]\u003c/a\u003e\u003c/sup\u003e. Etwaige variable Vergütungen vergüten nachhaltige Leistungen und vermeiden Anreize zur Eingehung unangemessener Risiken.\u003c/p\u003e\u003ch3\u003e1.1. Vergütungsgrundsätze\u003c/h3\u003e\u003cp\u003eDie Vergütung der Mitarbeiter wird grundsätzlich frei verhandelt und vertraglich vereinbart.\u003c/p\u003e\u003cp\u003eJeder Mitarbeiter der Gesellschaft erhält ein angemessenes, festes Jahresgehalt, das in zwölf gleichen Monatsbezügen ausbezahlt wird. Neben dem Jahresgehalt können Mitarbeitern noch weitere feste Vergütungsbestandteile wie zum Beispiel ein Zuschuss zum Mittagessen oder zu einem Nahverkehrsticket gewährt werden. Die Kriterien für eine gegebenenfalls erforderliche Fixgehaltsanpassung und für den konkreten Betrag der Ermessenstantieme sind unter anderem die Leistung des einzelnen Mitarbeiters und des jeweiligen Geschäftsbereichs und die historische Entgeltentwicklung des einzelnen Mitarbeiters.\u003c/p\u003e\u003cp\u003eDas Gesamtgehalt kann grundsätzlich einen variablen Gehaltsbestandteil beinhalten. Auch freiwillige Altersvorsorgeleistungen können bei der Gesellschaft Bestandteil der Vergütung sein. In Einzelfällen werden für besondere individuelle Leistungen oder außergewöhnliche Belastungen einmalige und freiwillige Sonderzahlungen gewährt.\u003c/p\u003e\u003cp\u003eDer Gesamtpool der variablen Vergütung als die Summe der ermittelten maximal erreichbaren Beträge an variabler Vergütung wird vor Gewährung der Prüfung unterzogen, ob dieses Gesamtvolumen im Hinblick auf die wirtschaftliche Situation und Liquidität der Gesellschaft angemessen ist; andernfalls werden die variablen Vergütungen gegebenenfalls gekürzt.\u003c/p\u003e\u003ch3\u003e1.2. Identifizierte Mitarbeiter\u003c/h3\u003e\u003cp\u003eDie Strukturen der Gesellschaft sind transparent, durch eine flache Hierarchie gekennzeichnet und nicht vergleichbar mit einem börsennotierten Unternehmen. Systemrelevanz für den Finanzmarkt besteht nicht. Darüber hinaus werden nur Geschäfte gemäß Geschäftserlaubnis durchgeführt. Vor dem Hintergrund der langjährigen Erfahrungen im Bereich der Verwaltung von Immobilienfonds tragen auch die standardisierten und über viele Jahre erprobten Prozesse zu einer gut funktionierenden und verlässlichen Ablauforganisation bei.\u003c/p\u003e\u003cp\u003eVor diesem Hintergrund hat die Gesellschaft folgende (Mitarbeiter-)Gruppe im Sinne des § 37 KAGB identifiziert:\u003c/p\u003e\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003eMitglieder der Geschäftsführung (entsprechend VI. Ziffer 20 der ESMA-Richtlinie)\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eWeitere Risikoträger, Mitarbeiter mit Kontrollfunktionen oder sonstige Mitarbeiter mit einer Gesamtvergütung, die der eines Geschäftsführers oder Risikoträgers entspricht, wurden nicht identifiziert.\u003c/p\u003e\u003cp\u003eDie Risikoträger werden grundsätzlich aufgrund ihrer hierarchischen Position, ihrer Vergütung, des Umfangs ihrer Kompetenzen in der Gesellschaft sowie aufgrund einer Überprüfung ihres funktionsbedingten potentiellen Einflusses auf das Gesamtrisikoprofil der Gesellschaft und der von der Gesellschaft verwalteten Fonds identifiziert. Die Einzelheiten des Entscheidungsprozesses zur Festlegung dieser Mitarbeitergruppen werden gesondert dokumentiert und regelmäßig überprüft.\u003c/p\u003e\u003ch3\u003e1.3. Vergütungssystem für „identifizierte Mitarbeiter“\u003c/h3\u003e\u003ch4\u003e1.3.1. Variable Vergütung\u003c/h4\u003e\u003cp\u003eDie Höhe des Anteils der variablen Vergütung – welche ausschließlich als zusätzlicher individueller Leistungsanreiz dienen soll – wird in einem angemessenen Verhältnis zum Anteil der festen Vergütung festgelegt. Dies impliziert, dass die Relation entsprechend für jede(n) identifizierte(n) Mitarbeiter(-Gruppe) gesondert zu bestimmen ist. Insoweit kann bestimmten Mitarbeitern – beispielsweise in Kontrollfunktionen – auch ausschließlich oder zumindest nahezu ausschließlich eine feste Vergütung gewährt werden.\u003c/p\u003e\u003cp\u003eDie variable Vergütung wird ausschließlich erfolgsabhängig gewährt. Die Höhe bestimmt sich nach der Zielerreichung des Mitarbeiters innerhalb eines für ihn definierten Zeitraums (in der Regel ein Geschäftsjahr).\u003c/p\u003e\u003ch4\u003e1.3.2. Risiko- und Leistungsmessung\u003c/h4\u003e\u003cp\u003eHinsichtlich der Leistung variabler Entgeltbestandteile setzt die Gesellschaft gemäß ihrer Unternehmenskultur und unter Berücksichtigung der Unternehmensgröße stärker auf Flexibilität und Individualität, soweit dies aus arbeitsrechtlicher Sicht für alle Mitarbeiter und insbesondere für die unter den Anwendungsbereich des KAGB fallenden identifizierten Mitarbeiter aufsichtsrechtlich zulässig ist. Die variable Vergütung eines Mitarbeiters bemisst sich stets anhand der individuellen Leistung.\u003c/p\u003e\u003cp\u003eIn die Leistungsbemessung können folgende, unterschiedliche Zielebenen einfließen:\u003c/p\u003e\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003eIndividuelle Ziele und\u003c/li\u003e\u003cli\u003eUnternehmensziele.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eDie variable Vergütung orientiert sich damit am Unternehmenserfolg der Gesellschaft, berücksichtigt aber auch Beiträge eines Mitarbeiters auf individueller Ebene.\u003c/p\u003e\u003cp\u003eDie variable Vergütung ist grundsätzlich auf einen Maximalbetrag von 50 % des Jahresfestgehalts begrenzt.\u003c/p\u003e\u003cp\u003eSoweit individuelle Ziele vereinbart werden, erfolgt dies anhand der Tätigkeit des jeweiligen Mitarbeiters und insbesondere der damit verbundenen Risiken. Im Hinblick auf die Aufgaben und Verantwortlichkeiten des jeweiligen Mitarbeiters ist bei der Zielfestlegung auf eine angemessene Mischung und damit ein Gleichgewicht von quantitativen und qualitativen Zielen sowie auf Position und Verantwortlichkeit des Mitarbeiters zu achten.\u003c/p\u003e\u003ch4\u003e1.3.4. Auszahlungsmodus der variablen Vergütungen\u003c/h4\u003e\u003cp\u003eDie variable Vergütung wird nach Abschluss eines Geschäftsjahres vollständig in bar an den Mitarbeiter ausbezahlt. Auf eine Auszahlung eines Teils der variablen Vergütung in Form von Instrumenten und der Anwendung einer Sperrfrist wird unter Anwendung des Verhältnismäßigkeitsgrundsatzes gem. „Leitlinien für solide Vergütungspolitiken unter Berücksichtigung der AIFMD“ der ESMA verzichtet.\u003c/p\u003e\u003cp\u003eAufgrund der verfolgten Anlagestrategien der AIF (Immobilien-Investmentvermögen) besteht kaum Potenzial zum Eingehen besonderer atypischer Risiken. Diese Anlagestrategien sind im Wesentlichen von langfristigen Immobilieninvestments geprägt und implizieren dabei die Erwartung von stabilen und stetigen Cashflows und Erträgen, sowohl auf Ebene der Investmentvermögen als auch auf Ebene der Gesellschaft.\u003c/p\u003e\u003ch4\u003e1.3.5. Abfindungen\u003c/h4\u003e\u003cp\u003eDie Gesellschaft gewährt Mitarbeitern bei deren Ausscheiden in der Regel keine Abfindung, um Anreize für Misserfolg zu vermeiden.\u003c/p\u003e\u003ch3\u003e1.4. Vergütungssystem für „Nicht identifizierte Mitarbeiter“\u003c/h3\u003e\u003cp\u003eDie Höhe des Anteils der variablen Vergütung der restlichen Mitarbeiter wird in einem angemessenen Verhältnis zum Anteil der festen Vergütung festgelegt. Grundsätzlich soll der variable Teil der Vergütung für Mitarbeiter, die nicht als identifizierte Mitarbeiter im Sinne des § 37 KAGB gelten, 50 % des Jahresfestgehalts nicht überschreiten. Eine zeitliche Zurückstellung von Anteilen an der variablen Vergütung oder deren (teilweise) Auszahlung in Instrumenten erfolgt nicht. Die tatsächliche Höhe der variablen Vergütung kann an die Erfüllung von Leistungsvorgaben oder Zielvereinbarungen gekoppelt sein.\u003c/p\u003e\u003ch2\u003eGovernance und Vergütungsausschuss\u003c/h2\u003e\u003ch3\u003e2.1. Gesellschafter und Aufsichtsrat\u003c/h3\u003e\u003cp\u003eDie Gestaltung und Verabschiedung der Vergütungspolitik erfolgt durch die Gesellschafter der Gesellschaft. Der Aufsichtsrat wird über wesentliche Veränderungen der Vergütungspolitik informiert.\u003c/p\u003e\u003cp\u003eDie Umsetzung der Vergütungspolitik der Gesellschaft wird mindestens einmal jährlich durch die Gesellschafter daraufhin überprüft, ob das Vergütungssystem insgesamt wie beabsichtigt geeignet, d.h. insbesondere angemessen und mit den nationalen und internationalen Vorschriften, Grundsätzen und Standards vereinbar ist. Die vereinbarte Vergütung und das grundsätzliche System werden auf jährlicher Basis im ersten Quartal eines jeden Kalenderjahres überprüft. Ziel der Überprüfung ist ein Vergleich des Gehaltsgefüges vergleichbarer Positionen der Mitarbeiter, ein Hinterfragen einer marktgerechten Vergütung und somit eine Analyse einer optimalen Wirkung des Entgeltssystems auf die Mitarbeiterzufriedenheit und damit auf die Mitarbeiterbindung.\u003c/p\u003e\u003cp\u003eDie Mitglieder des Aufsichtsrats der Gesellschaft beziehen keine anreizbezogene Vergütung.\u003c/p\u003e\u003ch3\u003e2.2. Vergütungsausschuss\u003c/h3\u003e\u003cp\u003eDie Gesellschaft hat bisher keinen Vergütungsausschuss eingerichtet. Nach Maßgabe der regulatorischen Anforderungen ist die Gesellschaft kein AIFM von erheblicher Bedeutung, insbesondere weil die Vielfalt der verwalteten Anlagestrategien sehr eingeschränkt ist (im Wesentlichen Immobilien-Investmentvermögen) und dadurch die Möglichkeiten zum Eingehen besonderer atypischer Risiken äußerst begrenzt sind.\u003c/p\u003e\u003ch3\u003e2.3. Nachhaltigkeit in der Vergütungspolitik\u003c/h3\u003e\u003cp\u003eUnsere Nachhaltigkeitsüberzeugungen stellen seit Unternehmensgründung einen zentralen Baustein unserer Vergütungspolitik dar. Dies gilt vor allem für Mitarbeiter mit variablem Vergütungsanteil, da die Einhaltung unserer Nachhaltigkeitsüberzeugungen Bestandteil der jährlichen individuellen Ziele wird. Variable Vergütungsbestandteile werden bei Nachhaltigkeitsverstößen im Rahmen des arbeitsrechtlich Möglichen und in Abhängigkeit von der Bedeutung der Verstöße nicht gewährt; insoweit werden Nachhaltigkeitsverstöße monetär sanktioniert. Zudem werden teils auch individuelle Prämien für das Erreichen von positiv definierten Nachhaltigkeitszielen vereinbart. Damit möchten wir bedeutsames nachhaltiges Handeln auch monetär wertschätzen.\u003c/p\u003e\u003cp class=\u0022ip-note-line\u0022 id=\u0022fn1\u0022\u003e\u003ca href=\u0022#fnref1\u0022\u003e[1]\u003c/a\u003e Der in diesem Text verwendete Begriff „Mitarbeiter“ wurde zur besseren Lesbarkeit des Textes gewählt und schließt sämtliche weiblichen, männlichen und intergeschlechtlichen Personen ein, die für die Gesellschaft tätig sind.\u003c/p\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
