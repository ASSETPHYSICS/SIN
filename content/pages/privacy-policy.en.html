<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-legal__inner\u0022\u003e\u003ch1\u003ePrivacy Policy\u003c/h1\u003e\n\u003cp class=\u0022ip-lead\u0022\u003eData protection notices in accordance with Art. 13, 14 and 21 DSGVO for the website, external pages and other processing operations of ServiceInvest Kapitalverwaltungsgesellschaft mbH\u003c/p\u003e\n\u003cnav class=\u0022ip-toc\u0022 aria-label=\u0022Inhaltsverzeichnis\u0022\u003e\u003cul\u003e\u003cli\u003e\u003ca href=\u0022#general\u0022\u003eI. General\u003c/a\u003e\u003cul\u003e\u003cli\u003e1. Person responsible\u003c/li\u003e\u003cli\u003e2. Definitions\u003c/li\u003e\u003cli\u003e3. Information on Data Processing\u003c/li\u003e\u003cli\u003e4. Storage Period\u003c/li\u003e\u003cli\u003e5. Automated Decision in individual cases including Profiling\u003c/li\u003e\u003cli\u003e6. Rights of affected Persons\u003c/li\u003e\u003cli\u003e7. Notification Obligations of the responsible Person\u003c/li\u003e\u003cli\u003e8. Obligation to provide\u003c/li\u003e\u003cli\u003e9. Right of Objection\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#data-processing-in-connection-with-the-use-of-our-website\u0022\u003eII. Data Processing in Connection with the Use of our Website\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#data-processing-on-our-career-site-karriere-2ig-de\u0022\u003eIII. Data processing on our career site (karriere.2ig.de)\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#other-data-processing-operations-outside-our-website-and-external-pages\u0022\u003eIV. Other Data Processing Operations outside our Website and external Pages\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\u0022#information-on-the-storage-period-of-consent-based-cookies-and-similar-technologies\u0022\u003eV. Information on the storage period of consent-based cookies and similar technologies\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/nav\u003e\n\u003ch2 id=\u0022general\u0022\u003eI. General\u003c/h2\u003e\n\u003ch3\u003ePerson responsible\u003c/h3\u003e\n\u003cp\u003eWe, the ServiceInvest Kapitalverwaltungsgesellschaft mbH, take the protection of your personal data and the legal obligations serving this protection very seriously. The legal requirements demand comprehensive transparency regarding the processing of personal data. Only if you are sufficiently informed about the purpose, nature and scope of the processing, the processing is comprehensible for you as an affected person.\u003c/p\u003e\n\u003cp\u003eOur data protection declaration therefore explains in detail what personal data is processed by us when you use our website (www.serviceinvest.de), all other websites that refer to it and in the other cases that may be explained here (for definitions, see I.2.).\u003c/p\u003e\n\u003cp\u003eThe responsible party within the meaning of the General Data Protection Regulation (DSGVO), the Federal Data Protection Act (BDSG) and other data protection regulations is\u003c/p\u003e\n\u003cp\u003eServiceInvest Kapitalverwaltungsgesellschaft mbH\u003cbr\u003eFürstenrieder Straße 61\u003cbr\u003eD-80686 München\u003c/p\u003e\n\u003cp\u003eE-Mail: \u003ca href=\u0022mailto:datenschutz@2ig.de\u0022\u003edatenschutz@2ig.de\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eHereinafter referred to as the „responsible“ or „we„.\u003c/p\u003e\n\u003cp\u003eYou can reach the data protection officer at:\u003c/p\u003e\n\u003cp\u003eSascha Kremer\u003cbr\u003eDisch-Haus\u003cbr\u003eBrückenstraße 21\u003cbr\u003e50667 Cologne\u003c/p\u003e\n\u003cp\u003ePlease note that links on our website may take you to other websites that are not operated by us but by third parties. Such links are either clearly marked by us or are recognizable by a change in the address line of your browser. We are not responsible for compliance with data protection regulations and secure handling of your personal data on these websites operated by third parties.\u003c/p\u003e\n\u003cp\u003e2. Definitions\u003c/p\u003e\n\u003ch3\u003eFrom DSGVO\u003c/h3\u003e\n\u003cp\u003eThis privacy policy uses the terms of the legal text of the DSGVO. You can view the definitions (Art. 4 DSGVO), for example, at \u003ca href=\u0022https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003ehttps://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eAdditional definitions:\u003c/p\u003e\n\u003ch3\u003eCookies and similar technologies\u003c/h3\u003e\n\u003cp\u003eCookies are text files that are stored or read by a website on your terminal device. They contain combinations of letters and numbers in order, for example, to recognize the user and his settings when he reconnects to the website that set the cookie, to enable him to remain logged in to a customer account or to statistically analyze specific user behavior.\u003c/p\u003e\n\u003cp\u003eThe WebStorage technology makes it possible to store variables and values locally in the user’s browser cache. The technique includes both the so-called „sessionStorage„, which remains stored until the browser tab is closed, and „localStorage„, which is stored in the browser cache until the cache is cleared by the user. The localStorage technique makes it possible, among other things, to recognize the user and his or her settings when our website is called up.\u003c/p\u003e\n\u003ch3\u003eData categories\u003c/h3\u003e\n\u003cp\u003eWhen we specify the categories of data processed, we are referring in particular to the following data: master data (e.g., names, addresses, dates of birth), contact data (e.g., e-mail addresses, telephone numbers, messenger services), content data (e.g., text entries, photographs, videos, contents of documents/files), contract data (e.g., subject matter of contract, terms, customer category), payment data (e.g. bank details, payment history, use of other payment service providers), usage data (e.g. history on our website, use of certain content, access times, contact or order history), connection data (e.g. device information, IP addresses, URL referrers), location data (e.g. GPS data, IP geolocation, access points).\u003c/p\u003e\n\u003cp\u003e3. Information on Data Processing\u003c/p\u003e\n\u003cp\u003eWe process personal data only to the extent permitted by law. Personal data is only passed on in the cases described below. Personal data is protected by appropriate technical and organizational measures (e.g. pseudonymization, encryption).\u003c/p\u003e\n\u003cp\u003eUnless we are required by law to store or disclose personal data to third parties (in particular law enforcement agencies), the decision as to which personal data we process and for how long, and the extent to which we disclose it, depends on which functions of the website you use in each individual case.\u003c/p\u003e\n\u003cp\u003e4. Storage Period\u003c/p\u003e\n\u003cp\u003eThe personal data will be deleted as soon as the purpose of processing ceases to apply or a prescribed storage period expires, unless there is a necessity for the continued storage of the personal data for the conclusion or performance of a contract. Insofar as we have to inform about the storage period of cookies and similar technologies, you will find the details at the end of this privacy policy.\u003c/p\u003e\n\u003cp\u003ePersonal data that we process as part of an application (see below) is stored for a period of six months after completion of the application process.\u003c/p\u003e\n\u003cp\u003e5. Automated decisions in individual cases including Profiling\u003cbr\u003eAutomated decisions in individual cases including profiling do not take place.\u003c/p\u003e\n\u003cp\u003e6. Rights of affected persons\u003c/p\u003e\n\u003cp\u003eAs an affected person, you have the right of information according to Art. 15 DSGVO, the right of rectification according to Art. 16 DSGVO, the right of erasure according to Art. 17 DSGVO, the right of restriction of processing according to Art. 18 DSGVO and the right of data portability according to Art. 20 DSGVO. With regard to the right of information and the right of erasure, the restrictions from §§ 34, 35 BDSG apply.\u003c/p\u003e\n\u003cp\u003eYou have the right to complain to a data protection supervisory authority (Art. 77 DSGVO in conjunction with § 19 BDSG).\u003c/p\u003e\n\u003cp\u003eThe data protection supervisory authority responsible for us/ for our head office is:\u003c/p\u003e\n\u003cp\u003eThe Hessian Commissioner for Data Protection and Freedom of Information\u003cbr\u003eGustav-Stresemann-Ring 1\u003cbr\u003e65189 Wiesbaden\u003c/p\u003e\n\u003cp\u003eHowever, you are free to complain to another data protection supervisory authority. You can find a list of supervisory authorities at: \u003ca href=\u0022https://www.bfdi.bund.de/\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003ehttps://www.bfdi.bund.de/\u003c/a\u003e (under Infothek/Addresses and Links).\u003c/p\u003e\n\u003cp\u003e7. Notification Obligations of the Responsible\u003c/p\u003e\n\u003cp\u003eWe will notify all recipients – to whom your personal data has been disclosed – of any rectification or erasure of your personal data or restriction of processing in accordance with Articles 16, 17(1) and 18 of the GDPR, unless such notification is impossible or involves a disproportionate effort. We will inform you of the recipients if you request this.\u003c/p\u003e\n\u003cp\u003e8. Obligation to Provide\u003c/p\u003e\n\u003cp\u003eUnless otherwise explained below in the information on the legal basis, you are not obliged to provide personal data. However, in the cases of Art. 6 (1) (b) DSGVO, the personal data is necessary for the performance of a contract or for the conclusion of a contract. If you do not provide the personal data concerned, the performance or conclusion of the contract is not possible. If you do not provide the data in the cases of Art. 6 para. 1 lit. a, f DSGVO, the use of the affected parts of our website is not possible.\u003c/p\u003e\n\u003cp\u003e9. Right of Objection\u003c/p\u003e\n\u003cp\u003eYou have the right to object at any time, on grounds relating to your particular situation, to the processing of personal data concerning you which is carried out on the basis of Article 6(1)(f) DSGVO. If personal data are processed for the purpose of direct marketing, you have the right to object at any time to the processing of personal data concerning you for the purpose of such marketing.\u003c/p\u003e\n\u003cp\u003eIn accordance with Art. 7 (3) p. 1 DSGVO, you have the right to revoke your consent at any time with effect for the future informally by post or e-mail. The lawfulness of the processing carried out on the basis of the consent until the revocation is not affected by this. Upon your revocation, we will delete the personal data processed on the basis of the consent if there is no other legal basis for its processing.\u003c/p\u003e\n\u003cp\u003eObjection can be made form-free and should be directed to the contact details above.\u003c/p\u003e\n\u003cp\u003eYou can revoke certain consent(s) on our „Careers“ page directly via our cookie consent tool. Please note that you must do this on every terminal device on which you have visited our website and consented to data processing.\u003c/p\u003e\n\u003ch2 id=\u0022data-processing-in-connection-with-the-use-of-our-website\u0022\u003eII. Data Processing in Connection with the Use of our Website\u003c/h2\u003e\n\u003cp\u003eThe use of the website and its functions regularly requires the processing of personal data.\u003c/p\u003e\n\u003ch3\u003eProvision of the Website\u003c/h3\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003ePurpose of processing:\u003c/strong\u003e Functionality and optimization of the website, as well as ensuring the security of our information technology systems for purely informational use of our website (without the use of additional functions); integration and display of functions and content (e.g. graphics) that we do not provide ourselves.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eLegal basis:\u003c/strong\u003e art. 6 para. 1 letter f DSGVO.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eData categories:\u003c/strong\u003e Connection data\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRecipients of the data:\u003c/strong\u003e IT service provider\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eIntended third country transfer:\u003c/strong\u003e None\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDo we store or read personal data on your end device based on your consent?\u003c/strong\u003e No\u003c/p\u003e\n\u003ch3\u003eContact\u003c/h3\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003ePurpose of processing:\u003c/strong\u003e processing of your contact request.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eLegal basis:\u003c/strong\u003e Art. 6(1)(f) DSGVO; if applicable, Art. 6(1)(b) DSGVO (if the request concerns pre-contractual measures or an existing contract).\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eData categories:\u003c/strong\u003e Master data, contact data, content data, usage data if applicable, connection data, contract data if applicable (depending on the type of request).\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRecipients of the data:\u003c/strong\u003e None\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eIntended third country transfer:\u003c/strong\u003e None\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDo we store or read personal data on your end device based on your consent?\u003c/strong\u003e No\u003c/p\u003e\n\u003ch2 id=\u0022data-processing-on-our-career-site-karriere-2ig-de\u0022\u003eIII. Data processing on our career site (karriere.2ig.de)\u003c/h2\u003e\n\u003ch3\u003eApplications\u003c/h3\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003ePurpose of processing:\u003c/strong\u003e Processing of your application and implementation of the application procedure; consideration of your application by our affiliated companies, provided that express consent has been given.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eLegal basis:\u003c/strong\u003e Art. 88 (1) DSGVO in conjunction with. § Section 26 (1) p. 1 BDSG; for applications to affiliated companies, Art. 6 (1) a DSGVO in conjunction with Art. 7 DSGVO, Section 26 (2) BDSG.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eData categories:\u003c/strong\u003e Master data, contact data, content data, contract data and, if applicable, special categories of personal data within the meaning of Art. 9 (1) DSGVO (depending on the specific job advertisement and the information you provide; only the data relating to your application that you provide to us and that we are permitted to process in the context of job applications will be stored).\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRecipients of the data:\u003c/strong\u003e rexx systems GmbH Headquarters, Süderstrasse 75-79, 20097 Hamburg; only if you expressly consent to this, will the data be passed on to affiliated companies for application procedures there.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eIntended third country transfer:\u003c/strong\u003e Switzerland on a case-by-case basis (based on the adequacy decision (Art. 45 DSGVO)).\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDo we store or read personal data on your end device based on your consent?\u003c/strong\u003e No\u003c/p\u003e\n\u003ch3\u003eMatomo\u003c/h3\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003ePurpose of processing:\u003c/strong\u003e Statistical evaluation, optimization and needs-based design of our careers site.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eLegal basis:\u003c/strong\u003e Art. 6 para. 1 letter a DSGVO.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eData categories:\u003c/strong\u003e Usage data, connection data\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRecipients of the data:\u003c/strong\u003e rexx systems GmbH Headquarters, Süderstrasse 75-79, 20097 Hamburg, Germany.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eIntended third country transfer:\u003c/strong\u003e None\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDo we store or read personal data on your end device based on your consent?\u003c/strong\u003e Yes (details can be found in the overview at the end of this statement)\u003c/p\u003e\n\u003ch3\u003eJob Alert\u003c/h3\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003ePurpose of processing:\u003c/strong\u003e notification of new job offers; proof of your consent; ensuring the security of our information technology systems.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eLegal basis:\u003c/strong\u003e Art. 6 para. 1 lit. a, f DSGVO.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eData categories:\u003c/strong\u003e Contact data, content data and connection data, if applicable.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRecipients of the data:\u003c/strong\u003e IT service provider, if applicable.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eIntended third country transfer:\u003c/strong\u003e None\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDo we store or read personal data on your end device based on your consent?\u003c/strong\u003e No\u003c/p\u003e\n\u003ch3\u003eCookie consent service\u003c/h3\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003ePurpose of processing:\u003c/strong\u003e When you access our website, certain information is stored on your end device or read out if this is absolutely necessary for the operation of our website. This includes information processed by our cookie consent service to ensure that only those cookies and similar technologies are set or read that are technically absolutely necessary to operate our website or to which you have consented.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eLegal basis:\u003c/strong\u003e Art. 6 para. 1 lit. c, f DSGVO.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eData categories:\u003c/strong\u003e Usage data, connection data.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRecipients of the data:\u003c/strong\u003e rexx systems GmbH Headquarters, Süderstrasse 75-79, 20097 Hamburg, Germany.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eIntended third country transfer:\u003c/strong\u003e None.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDo we store or read personal data on your end device based on your consent?\u003c/strong\u003e No\u003c/p\u003e\n\u003ch2 id=\u0022other-data-processing-operations-outside-our-website-and-our-external-pages\u0022\u003eIV. Other Data Processing Operations outside our Website and our external Pages\u003c/h2\u003e\n\u003cp\u003eGuest WLAN\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003ePurpose of processing:\u003c/strong\u003e use of our guest WLAN; ensuring the security of our information technology systems. This is at the same time our legitimate interest.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eLegal basis:\u003c/strong\u003e Art. 6 para. 1 letter f DSGVO.\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eData categories:\u003c/strong\u003e Connection data\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eRecipients of the data:\u003c/strong\u003e None\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eIntended third country transfer:\u003c/strong\u003e None\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDo we store or read personal data on your terminal device based on your consent?\u003c/strong\u003e No\u003c/p\u003e\n\u003ch2 id=\u0022information-on-the-storage-period-of-consent-based-cookies-and-similar-technologies\u0022\u003eV. Information on the storage period of consent-based cookies and similar technologies\u003c/h2\u003e\n\u003cp\u003eIn the following, we inform you about the names and functioning duration of the cookies and similar technologies used by the above-mentioned plugins and services – in case of their consent. The information is presented according to the following scheme:\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eService:\u003c/strong\u003e Matomo\u003c/p\u003e\n\u003cp\u003e_pk_id*\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDomain name:\u003c/strong\u003e karriere.2ig.de\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eExpiration:\u003c/strong\u003e 13 months\u003c/p\u003e\n\u003cp\u003eRegisters a unique ID for a website visitor that logs how the visitor uses the website. The data is used for statistics.\u003c/p\u003e\n\u003cp\u003e_pk_ref*\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDomain name:\u003c/strong\u003e karriere.2ig.de\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eExpiration:\u003c/strong\u003e 6 months\u003c/p\u003e\n\u003cp\u003eThis cookie is used as a reference to the anonymous tracking session on the site.\u003c/p\u003e\n\u003cp\u003e_pk_ses*\u003c/p\u003e\n\u003cp class=\u0022ip-kv\u0022\u003e\u003cstrong\u003eDomain name:\u003c/strong\u003e karrie
