<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap\u0022\u003e\u003cdiv class=\u0022ip-nh-card\u0022\u003e\n\u003ch2\u003eUnsere Überzeugungen\u003c/h2\u003e\n\u003cp\u003eAls Teil der Institutional Investment Group basiert das zentrale Nutzen- und Werteversprechen für die Anleger und Mitarbeiter der ServiceInvest Kapitalverwaltungsgesellschaft mbH darauf, Nachhaltigkeitsfaktoren in sämtlichen Handlungen und Dienstleistungen einen wesentlichen Stellenwert einzuräumen.\u003c/p\u003e\n\u003cp\u003eBefördert durch unsere gewonnene Marktstellung und die damit gestiegene gesellschaftliche Verantwortung – aber auch durch die generelle gesellschaftliche Entwicklung – ist es unser wesentliches Bestreben den eigenen Wirkungskreis zu nutzen, um einen bedeutsamen Unternehmensbeitrag für eine nachhaltige Umwelt und Gesellschaft zu leisten.\u003c/p\u003e\n\u003cp\u003eDeswegen hat die ServiceInvest die allgemeinen Grundsätze zur nachhaltigen Unternehmensführung in eine eigene unternehmensbezogene Nachhaltigkeitsstrategie übersetzt, die nachhaltiges Handeln in und durch unser Unternehmen verbindlich macht und zudem etwaige nachteilige Auswirkungen bei Investitionsentscheidungen auf Nachhaltigkeitsfaktoren berücksichtigt.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eZentrale Eckpunkte für unser nachhaltiges Handeln\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eZentrale Inhalte und Eckpunkte unseres Handelns sind:\u003c/p\u003e\n\u003cul class=\u0022ip-check\u0022\u003e\n\u003cli\u003eFörderung von verantwortlichem und nachhaltigem Handeln unserer Immobilienmanagement-Partner durch die Verankerung von Verhaltensleitlinien in der Geschäftsbeziehung.\u003c/li\u003e\n\u003cli\u003eFörderung von Investitions- und Bewirtschaftungsinitiativen an Immobilien, die positiv darauf hinwirken,\n\u003cul class=\u0022ip-sub\u0022\u003e\u003cli\u003edie CO\u003csub\u003e2\u003c/sub\u003e-Emission zu reduzieren und\u003c/li\u003e\u003cli\u003edie Gesamtbelastung von Mietern durch reduzierte Heiz- und Nebenkosten zu senken.\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\n\u003cli\u003eFörderung von verantwortungsvollem Umgang mit Ressourcen.\u003c/li\u003e\n\u003cli\u003eFörderung von Informationstechnologie und Prozessen, die darauf ausgerichtet sind,\n\u003cul class=\u0022ip-sub\u0022\u003e\u003cli\u003eden Verbrauch von Ressourcen durch Fondsimmobilien transparent sowie\u003c/li\u003e\u003cli\u003enachhaltiges Handeln messbar\u003c/li\u003e\u003c/ul\u003e\nzu machen.\u003c/li\u003e\n\u003cli\u003eSanktionierung von Verhalten, das darauf ausgerichtet ist, gegen wesentliche Nachhaltigkeitsgrundsätze zu verstoßen.\u003c/li\u003e\n\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003ePrinzipien und Kodizes\u003c/h2\u003e\u003cp class=\u0022ip-signatory\u0022\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/pri-signatory.png\u0022 alt=\u0022Principles for Responsible Investment (PRI) – Signatory\u0022 width=\u0022300\u0022 height=\u0022111\u0022\u003e\u003c/p\u003e\u003cp\u003eDie Institutional Investment Group mit all ihren Tochtergesellschaften ist Unterzeichnerin der von den Vereinten Nationen unterstützten Initiative Principles for Responsible Investment (PRI). Dieses Netzwerk internationaler Investoren hat sich der Etablierung und Umsetzung der Prinzipien verantwortlichen Investierens in die Praxis verschrieben. Die PRI wurden von der Gemeinschaft der Investoren entwickelt und spiegeln die Ansicht wider, dass Umwelt-, Sozial- und Governance-Themen (ESG) die Performance von Investmentportfolios beeinflussen können und daher von Investoren angemessen berücksichtigt werden müssen, wenn sie ihrer gesellschaftlichen Verantwortung nachkommen wollen. Durch die Umsetzung der Grundsätze tragen die Unterzeichner zur Entwicklung eines nachhaltigeren globalen Finanzsystems bei.\u003c/p\u003e\u003cp\u003eDie 2006 von der UNEP Finance Initiative und dem UN Global Compact ins Leben gerufenen PRI bieten einen freiwilligen Rahmen, mit dem alle Investoren ESG-Aspekte in ihre Entscheidungsfindung und ihre Eigentumsverhältnisse einbeziehen und so ihre Ziele besser mit denen der Gesellschaft als Ganzes in Einklang bringen können.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003ch3\u003eDie 6 Prinzipien für verantwortliches Investieren\u003c/h3\u003e\u003col class=\u0022ip-principles\u0022\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinzip 1:\u003c/span\u003e\u003cp\u003eWir werden ESG-Themen in die Analyse- und Entscheidungsprozesse im Investmentbereich einbeziehen.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinzip 2:\u003c/span\u003e\u003cp\u003eWir werden aktive Anteilseigner sein und ESG-Themen in unserer Investitionspolitik und -praxis berücksichtigen.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinzip 3:\u003c/span\u003e\u003cp\u003eWir werden Unternehmen und Körperschaften, in die wir investieren, zu einer angemessenen Offenlegung in Bezug auf ESG-Themen anhalten.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinzip 4:\u003c/span\u003e\u003cp\u003eWir werden die Akzeptanz und die Umsetzung der Prinzipien in der Investmentbranche vorantreiben.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinzip 5:\u003c/span\u003e\u003cp\u003eWir werden zusammenarbeiten, um unsere Wirksamkeit bei der Umsetzung der Prinzipien zu steigern.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cspan class=\u0022ip-kicker\u0022\u003ePrinzip 6:\u003c/span\u003e\u003cp\u003eWir werden über unsere Aktivitäten und Fortschritte bei der Umsetzung der Prinzipien Bericht erstatten.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eUN Global Compact\u003c/h2\u003e\u003cp\u003eDer UN Global Compact ist die weltweit größte und wichtigste Initiative für verantwortungsvolle Unternehmensführung. Er basiert auf 10 universellen Prinzipien in den Bereichen\u003c/p\u003e\u003cul class=\u0022ip-bullets\u0022\u003e\u003cli\u003eMenschenrechte,\u003c/li\u003e\u003cli\u003eArbeitsnormen,\u003c/li\u003e\u003cli\u003eUmweltschutz und\u003c/li\u003e\u003cli\u003eKorruptionsprävention\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eund verfolgt zudem über die 17 Nachhaltigen Entwicklungsziele (Sustainable Development Goals) die Vision einer inklusiven und nachhaltigen Weltwirtschaft zum Nutzen aller Menschen, Gemeinschaften und Märkte.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003ch3\u003eDie 17 Nachhaltigen Entwicklungsziele lauten:\u003c/h3\u003e\u003cul class=\u0022ip-sdg\u0022\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-01.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 1\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-02.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 2\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-03.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 3\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-04.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 4\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022  src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-13.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 13\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-14.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 14\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-15.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 15\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-16.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 16\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-17.jpg\u0022 alt=\u0022Nachhaltiges Entwicklungsziel 17\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/sdg/sdg-wheel.png\u0022 alt=\u0022SDG-Farbrad\u0022 loading=\u0022lazy\u0022 width=\u0022120\u0022 height=\u0022120\u0022\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eBerücksichtigung von Nachhaltigkeitsrisiken in Investitionsentscheidungen\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eNachhaltigkeitsrisiken sind Ereignisse oder Bedingungen in den Bereichen Umwelt, Soziales oder Unternehmensführung, deren Eintreten tatsächlich oder potenziell wesentliche negative Auswirkungen auf den Wert einer Investition haben könnte.\u003c/p\u003e\n\u003cp\u003eIm Rahmen unseres Investitionsentscheidungsprozesses werden Nachhaltigkeitsrisiken im Zuge unseres Adverse Sustainable Screenings identifiziert und bewertet. Dabei prüfen wir eine Investition anhand definierter ESG-Kriterien auf Ereignisse oder Bedingungen, die sich wesentlich nachteilig auf ihren Wert auswirken können. Die Ergebnisse dieses Screenings fließen in die abschließende Investitionsentscheidung ein. Überschreiten die identifizierten Nachhaltigkeitsrisiken die von uns festgelegten Wesentlichkeitsschwellen, kann dies zur Ablehnung der Investition aus Nachhaltigkeitsgründen führen.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eSystematische Berücksichtigung von nachteiligen Nachhaltigkeitsauswirkungen\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eInvestitionsvorschläge werden auf wichtige negative Nachhaltigkeitsauswirkungen und Nachhaltigkeitsindikatoren im Rahmen unseres Adverse Sustainable Screenings besonders geprüft:\u003c/p\u003e\u003cul class=\u0022ip-criteria\u0022\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Pollution.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eUmwelt \u0026amp; Biodiversität\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eAnzeichen für einen mangelhaften Umgang bei der Beachtung von Umweltstandards oder der Vermeidung oder Behebung von Kontaminationen\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Carbon.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eTreibhauseffekt-fördernde Gase ohne Ausstiegsszenario\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eAnzeichen für die direkte Unterstützung der Produktion oder des Vertriebs von ozonzerstörenden Gasen ohne Ausstiegsszenario\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Bomb.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eKontroverse Waffen / Rüstung\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eAnzeichen für die direkte Unterstützung der Produktion oder des Vertriebs kontroverser Waffen (Streubomben, Anti-Personenminen) oder relevanter Systemkomponenten\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-ShakeHands.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eMenschen- \u0026amp; Arbeitnehmerrechte\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eAnzeichen für einen mangelhaften Umgang bei Verstößen gegen internationale Menschenrechtskonventionen oder die ILO-Kernarbeitsnormen (Kinderarbeit, Zwangsarbeit, Diskriminierung, Versammlungsfreiheit)\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Money.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eGeldwäscheprävention\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eAnzeichen für einen mangelhaften Umgang im Screening oder bei Vorfällen zu Geldwäsche\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003cli\u003e\u003cimg src=\u0022/wp-content/themes/Divi-SIN/images/nachhaltigkeit/icon-Money.svg\u0022 alt=\u0022\u0022 width=\u002256\u0022 height=\u002256\u0022\u003e\u003cdiv\u003e\u003cspan class=\u0022ip-kicker\u0022\u003eKorruptionsprävention\u003c/span\u003e\u003cp\u003e\u003cstrong\u003eAnzeichen für einen mangelhaften Umgang im Screening oder mit Korruptions- und Bestechungsvorfällen\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eWobei wir uns in unserem \u003ca href=\u0022/erklaerung-zu-den-wichtigsten-nachteiligen-auswirkungen-auf-die-nachhaltigkeitsfaktoren-2/\u0022\u003ePrincipal Adverse Impact Statement\u003c/a\u003e auf folgende drei Indikatoren fokussieren: (i) fossile Energieträger, (ii) Energie-Effizienz und (iii) Intensität des Energieverbrauchs. Unsere Strategien zur Feststellung und Gewichtung dieser Nachhaltigkeitsindikatoren sind in dem Statement beschrieben.\u003c/p\u003e\u003cp\u003eDie Ergebnisse des Adverse Sustainable Screenings fließen in die abschließende Investitionsentscheidung ein und führen im Fall der Überschreitung von Wesentlichkeitsgrenzen zu unserem Veto aus Nachhaltigkeitsgründen.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap ip-nh-split\u0022\u003e\u003cdiv class=\u0022ip-nh-head\u0022\u003e\u003ch2\u003eStewardship\u003c/h2\u003e\u003c/div\u003e\u003cdiv class=\u0022ip-nh-body\u0022\u003e\u003cp\u003eBefördert durch unsere gewonnene Marktstellung und die damit gestiegene gesellschaftliche Verantwortung – aber auch durch die generelle gesellschaftliche Entwicklung – ist es unser wesentliches Bestreben den eigenen Wirkungskreis zu nutzen, um einen bedeutsamen Unternehmensbeitrag für eine nachhaltige Umwelt und Gesellschaft zu leisten.\u003c/p\u003e\n\u003cp\u003eDazu zählt auch die Nutzung des eigenen Einflusses (Stewardship) auf Dritte zur Optimierung des langfristigen Gesamtwerts, einschließlich gemeinsamer wirtschaftlicher, sozialer und ökologischer Werte, von denen die Renditen und die Interessen der Anleger und Begünstigten abhängen.\u003c/p\u003e\n\u003cp\u003eWie wir als Institutional Investment Group im Sinne der Nachhaltigkeit verantwortungsvoll Einfluss nehmen wollen beschreibt die folgende Leitlinie:\u003c/p\u003e\n\u003cp\u003e\u003ca href=\u0022/wp-content/uploads/2024/12/2023-10-31-2IG-Stewardship-Policy.pdf\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eStewardship-Policy\u003c/a\u003e.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->

<!-- wp:divi/text {"content":{"innerContent":{"desktop":{"value":"\u003cdiv class=\u0022ip-wrap\u0022\u003e\u003cdiv class=\u0022ip-nh-card\u0022\u003e\n\u003ch2\u003eNachhaltigkeit in der Vergütungspolitik\u003c/h2\u003e\n\u003cp\u003eUnsere Nachhaltigkeitsüberzeugungen stellen seit Unternehmensgründung einen zentralen Baustein unserer Vergütungspolitik dar. Dies gilt vor allem für Mitarbeiter mit variablem Vergütungsanteil, da die Einhaltung unserer Nachhaltigkeitsüberzeugungen Bestandteil der jährlichen individuellen Ziele wird. Variable Vergütungsbestandteile werden bei Nachhaltigkeitsverstößen im Rahmen des arbeitsrechtlich Möglichen und in Abhängigkeit von der Bedeutung der Verstöße nicht gewährt; insoweit werden Nachhaltigkeitsverstöße monetär sanktioniert. Zudem werden teils auch individuelle Prämien für das Erreichen von positiv definierten Nachhaltigkeitszielen vereinbart. Damit möchten wir bedeutsames nachhaltiges Handeln auch monetär wertschätzen.\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"}}},"builderVersion":"5.0.0-public-beta.2"} /-->
